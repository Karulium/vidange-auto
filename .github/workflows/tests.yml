# Tests du programme du Pi, lancés à chaque PR et à chaque changement de main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Machine de GitHub figée sur Ubuntu 24.04 : avec ubuntu-latest passé à 26.04 (novembre 2026), la
# fabrication de l'outil pioasm du Pico SDK 2.1.1 échoue (programme de l'accéléromètre).
jobs:
  pi:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Même version que Raspberry Pi OS Bookworm.
          python-version: "3.11"
      - name: Installation
        run: pip install -e ".[dev]"
      - name: Style (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (pytest)
        run: pytest
      - name: Vérification des réglages du dépôt
        run: vidange --verifier

  # Programme du RP2040 de l'accéléromètre : essais sur PC, puis fabrication du vrai programme.
  accelerometre:
    runs-on: ubuntu-24.04
    env:
      PICO_SDK_VERSION: "2.1.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installation
        run: |
          # Lecture et vérification de pi/reglages/accelerometre.yaml (par le code du Pi).
          pip install "pydantic>=2.5,<3" "PyYAML>=6.0,<7"
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Essais sur PC
        run: |
          cmake -S accelerometre/tests -B accelerometre/build-essais
          cmake --build accelerometre/build-essais
          ctest --test-dir accelerometre/build-essais --output-on-failure
      - name: Pico SDK (gardé d'une fois sur l'autre)
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}
      - name: Téléchargement du Pico SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb
      - name: Fabrication du programme du RP2040
        run: |
          cmake -S accelerometre -B accelerometre/build -DPICO_SDK_PATH="$PWD/pico-sdk"
          cmake --build accelerometre/build -j 4
      - name: Programme à télécharger (accelerometre-complet.uf2 et accelerometre.bin)
        uses: actions/upload-artifact@v4
        with:
          name: accelerometre
          path: |
            accelerometre/build/accelerometre-complet.uf2
            accelerometre/build/accelerometre.bin

  # Programme des cartes de pesée (RP2040 + HX711, bus RS485) : essais sur PC, puis fabrication
  # d'un programme par carte.
  pesee:
    runs-on: ubuntu-24.04
    env:
      PICO_SDK_VERSION: "2.1.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installation
        run: |
          # Lecture et vérification de pesees.yaml et entrees-sorties.yaml (par le code du Pi).
          pip install "pydantic>=2.5,<3" "PyYAML>=6.0,<7"
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Essais sur PC
        run: |
          cmake -S pesee/tests -B pesee/build-essais
          cmake --build pesee/build-essais
          ctest --test-dir pesee/build-essais --output-on-failure
      - name: Pico SDK (gardé d'une fois sur l'autre)
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}
      - name: Téléchargement du Pico SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk.git
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb
      - name: Fabrication des programmes des cartes
        run: |
          cmake -S pesee -B pesee/build -DPICO_SDK_PATH="$PWD/pico-sdk"
          cmake --build pesee/build -j 4
      - name: Programmes à télécharger (un .uf2 par carte)
        uses: actions/upload-artifact@v4
        with:
          name: pesee
          path: pesee/build/*.uf2

  # Programmes des 2 ESP32-C3 du poste du fût (plateau de pesée et boîte du poste) : essais sur
  # PC (faux HX711, fausses trames radio, Modbus), puis fabrication des 2 programmes avec ESP-IDF,
  # dans l'image Docker officielle d'Espressif (environ 3 à 5 min, surtout le téléchargement).
  poste_fut_radio:
    runs-on: ubuntu-24.04
    env:
      IDF_VERSION: "v5.5.4"
    steps:
      - uses: actions/checkout@v4
      - name: Essais sur PC
        run: |
          cmake -S poste_fut_radio/tests -B poste_fut_radio/build-essais
          cmake --build poste_fut_radio/build-essais
          ctest --test-dir poste_fut_radio/build-essais --output-on-failure
      - name: Fabrication des 2 programmes (ESP-IDF, ESP32-C3)
        run: |
          docker run --rm -v "$PWD":/projet -w /projet "espressif/idf:$IDF_VERSION" bash -c '
            set -e
            git config --global --add safe.directory "*"
            # Lecture et vérification de pesees.yaml et entrees-sorties.yaml (par le code du Pi).
            pip install -q "pydantic>=2.5,<3" "PyYAML>=6.0,<7"
            mkdir -p poste_fut_radio/build
            for carte in plateau boite; do
              idf.py -C poste_fut_radio/$carte build
            done
            # Un seul fichier par carte, à charger à 0x0 (essai-materiel.md, étape 1).
            (cd poste_fut_radio/plateau/build &&
              python -m esptool --chip esp32c3 merge_bin -o ../../build/plateau_fut-complet.bin @flash_args)
            (cd poste_fut_radio/boite/build &&
              python -m esptool --chip esp32c3 merge_bin -o ../../build/boite_poste_fut-complet.bin @flash_args)
          '
      - name: Programmes à télécharger (un fichier par carte)
        uses: actions/upload-artifact@v4
        with:
          name: poste_fut_radio
          path: poste_fut_radio/build/*-complet.bin
