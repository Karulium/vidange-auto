  # Nettoyage (tâche 38 ; fiche du module gelé, lot validé les 27/10, 31/10, 01/11 et 04/11).
  # Broches : EXEMPLES, à remplir avec l'Implantation (armoire). Le Pi lit et attend : la sécurité est
  # câblée (store_ferme dans la boucle d'arrêt du portique par son 2e contact ; chaîne UV-ozone : reeds
  # du bas du store + porte_spray en série dans l'alimentation de generateur_ozone et lampe_uv ;
  # verrous fermés sans courant, clé de dépannage). Le moteur du store n'est PAS un signal du Pi
  # (commande maintenue : 2 boutons câblés, fins de course dans le moteur).
  # Pas encore dans la liste : ozone_securite_ok (contact de l'alarme d'ozone câblée, appareil pas
  # choisi : facultatif, le Pi l'affiche seulement s'il est ici).
  # Capteurs de la purge (tâche 38 ter, pièces choisies le 06/11/2026) : 2 SPS30 (particules) et un
  # SDP810-125Pa (pression enceinte / conteneur). Broches et adresses d'EXEMPLE (Implantation).
  particules_dedans:
    exemple: true
    description: Capteur de particules SPS30 de l'enceinte (dedans), par convertisseur TTL-RS485
    carte: rs485_sps30
    broche: [A, B]
    type: serie
    tension: 5
    module: nettoyage
    appareil: sps30
    unite: µg/m³
    # EXEMPLES, à vérifier sur la notice du SPS30.
    particules:
      grandeur: pm2_5     # concentration en masse lue : pm1_0, pm2_5, pm4_0 ou pm10
      delai_muet_s: 5     # sans mesure valable depuis ce délai : capteur « muet »
  particules_dehors:
    exemple: true
    # UART3 du Pi 5 : GPIO 8 (TX) et 9 (RX), avec « dtoverlay=uart3-pi5 » dans config.txt
    # (pi/systeme/essai-capteurs-purge.md). Le Pi parle en 3,3 V, comme le SPS30.
    description: Capteur de particules SPS30 de l'air extérieur (dehors), sur l'UART3 du Pi
    carte: pi
    broche: [GPIO8, GPIO9]
    type: serie
    tension: 3.3
    module: nettoyage
    appareil: sps30
    fichier: /dev/ttyAMA3
    unite: µg/m³
    particules:
      grandeur: pm2_5
      delai_muet_s: 5
      vitesse_bauds: 115200   # UART du Pi seulement (sur l'USB-RS485, c'est la carte qui le dit)
      delai_reponse_s: 0.3    # UART du Pi seulement
  pression_enceinte:
    exemple: true
    # SDP810-125Pa : tuyau « P » dans l'enceinte, tuyau « N » dans le conteneur (côté du filtre).
    # Surpression de l'enceinte = valeur positive. Si c'est l'inverse : « inverser: true ».
    description: Pression différentielle enceinte / conteneur (SDP810-125Pa, I2C)
    carte: pi
    broche: [GPIO2, GPIO3]
    type: i2c
    tension: 3.3
    adresse: 0x25
    module: nettoyage
    appareil: sdp810
    fichier: /dev/i2c-1
    unite: Pa
    pression:
      inverser: false
  store_ferme:
    exemple: true
    # Les 2 reeds IP67 du bas du store EN SÉRIE : fermé = store fermé aux deux bouts.
    description: Store de l'enceinte fermé (2 reeds du bas en série ; pour informer, la sécurité est câblée)
    carte: entrees_24v_1
    broche: E7
    type: contact
    tension: 24
    repos: ouvert
    module: nettoyage
  verrous_store:
    exemple: true
    # 2 verrous électriques 12 V, FERMÉS SANS COURANT : le store reste verrouillé si le Pi s'arrête.
    description: Verrous du store (commandé = sous tension = déverrouillé)
    carte: relais_2
    broche: K1
    type: relais
    tension: 12
    repos: ouvert
    module: nettoyage
  eclairage_enceinte:
    exemple: true
    description: Éclairage de l'enceinte (alimentation 12 V des 2 rubans LED, toujours ensemble)
    carte: relais_2
    broche: K2
    type: relais
    tension: 12
    repos: ouvert
    module: nettoyage
  ventilateur_enceinte:
    exemple: true
    description: Ventilateur de l'enceinte (coupure 230 V du moteur EC)
    carte: relais_2
    broche: K3
    type: relais
    tension: 230
    repos: ouvert
    module: nettoyage
  generateur_ozone:
    exemple: true
    # Prise du générateur VEVOR (il repart seul en HOLD après une coupure : c'est le relais qui
    # commande). Alimenté seulement par la chaîne UV-ozone câblée.
    description: Générateur d'ozone (relais sur sa prise 230 V, derrière la chaîne câblée)
    carte: relais_2
    broche: K4
    type: relais
    tension: 230
    repos: ouvert
    module: nettoyage
  lampe_uv:
    exemple: true
    description: Lampe UV-C des têtes (ballast 230 V, derrière la chaîne câblée)
    carte: relais_2
    broche: K5
    type: relais
    tension: 230
    repos: ouvert
    module: nettoyage
  relais_compresseur:
    exemple: true
    # Module Air (tâche 42, vidange.air) : fermé = compresseur autorisé ; le Pi l'ouvre pendant la
    # nuit UV-ozone. La coupure de sécurité (arrêt d'urgence, ozone, purge) est câblée en dur.
    description: Compresseur (commandé = alimenté)
    carte: relais_2
    broche: K6
    type: relais
    tension: 230
    repos: ouvert
    module: air_comprime
  coupure_ventilateur_armoire:
    exemple: true
    # Contact FERMÉ au repos : le ventilateur de l'armoire tourne si le Pi s'arrête. Le Pi le coupe
    # pendant la nuit UV-ozone (commandé = ventilateur coupé).
    description: Coupure du ventilateur de l'armoire (commandé = coupé)
    carte: relais_2
    broche: K7
    type: relais
    tension: 230
    repos: ferme
    module: armoire
  consigne_ventilateur:
    exemple: true
    # Consigne 0-10 V du moteur EC (il s'arrête sans signal) : sortie PWM matérielle du Pi + module
    # PWM → 0-10 V (docs/decisions.md, réponses à la PR n° 80). GPIO19 = canal 3 de la puce PWM du Pi 5
    # avec « dtoverlay=pwm-2chan,pin=18,func=3,pin2=19,func2=3 » (canal 2 = GPIO18, le servo de la
    # caméra du dosage), à vérifier. EXEMPLES à vérifier sur la notice du module : période, tension
    # à 100 %. Procédure : pi/systeme/essai-capteurs-purge.md.
    description: Consigne 0-10 V du ventilateur de l'enceinte (module PWM → 0-10 V)
    carte: pi
    broche: GPIO19
    type: pwm
    tension: 3.3
    module: nettoyage
    pwm:
      fichier: /sys/class/pwm/pwmchip0
      canal: 3
      periode_us: 1000        # 1 kHz
      pleine_echelle_v: 10    # tension du module quand le rapport cyclique est de 100 %
  relais_2_bus:
    exemple: true
    description: Liaison I2C vers la puce PCF8574 de la carte relais n° 2
    carte: pi
    broche: [GPIO2, GPIO3]
    type: i2c
    tension: 3.3
    adresse: 0x21
    module: armoire
    appareil: pcf8574
    fichier: /dev/i2c-1
  # Servos du boîtier du chariot : seulement le SIGNAL (3,3 V de la PCA9685) ; le + vient du BEC
