# Liste des entrées/sorties de la machine : chaque capteur, relais, bus, avec sa carte et sa broche.
# Le code ne connaît que les NOMS (« reed_panneau_poste_fut »), jamais la carte ni la broche.
#
# ATTENTION : les cartes et les signaux marqués « exemple: true » sont des EXEMPLES pour montrer
# le format. La vraie liste sera remplie depuis le projet « Vidange automatique » ;
# enlever « exemple: true » sur chaque ligne devenue vraie.
#
# Vérifié par les tests et au démarrage du Pi (une erreur empêche de démarrer) :
#   - une broche utilisée deux fois sur la même carte (sauf un bus partagé, voir plus bas) ;
#   - deux appareils à la même adresse sur un même bus ;
#   - une carte inconnue, un module inconnu ;
#   - plus d'entrées (ou de sorties) branchées que la carte n'en a ;
#   - une tension trop forte pour la carte, et surtout du 24 V sur une carte sans isolement ;
#   - « repos » oublié sur un contact, un capteur PNP/NPN ou un relais ; « adresse » oubliée en I2C ;
#   - une liaison au Pi incomplète : repère sans broche, broche que la puce n'a pas,
#     broche du Pi prise deux fois, signal qui ne peut pas être sur cette carte ;
#   - un nom écrit deux fois, un nom inconnu, un nombre mal écrit.

# Au-dessus de cette tension (en volts), un signal doit arriver sur une carte isolée
# (entrées optocouplées, relais) : les broches nues des cartes (Pi, ESP32) grilleraient.
tension_max_sans_isolement: 5

# Les modules de la machine (le champ « module » d'un signal doit être l'un d'eux).
# « armoire » = ce qui est dans l'armoire électrique (écran, capteurs d'ambiance, voyant-buzzer).
modules:
  - armoire
  - poste_fut
  - griffe
  - mycelium
  - porte_bocal
  - lavage
  - remplissage
  - stockage
  - portique
  - prehension
  - nettoyage
  - spray
  - micropore
  - fermeture_seaux
  - air_comprime
  - entonnoir

# Les cartes où l'on branche les signaux.
#   description : en clair, pour s'y retrouver.
#   entrees, sorties : combien la carte en a. Ne rien mettre si ses broches servent
#     aussi bien d'entrée que de sortie (GPIO du Pi) : seul le double emploi est alors vérifié.
#   tension_max : la plus forte tension (V) que ses bornes acceptent.
#   isolee : true si ses entrées sont optocouplées ou ses sorties sont des relais.
#   liaison : comment le Pi la lit ou la commande (rien pour une carte que le Pi ne lit pas,
#     comme les cartes FluidNC). Trois façons :
#     - type: gpio      broches GPIO du Pi.
#         fichier : le fichier de Linux des broches (Pi 5 : /dev/gpiochip0).
#         broches : repère sur la carte → broche du Pi (E1: GPIO17). Sans « broches » :
#           les repères des signaux sont déjà des broches du Pi (la carte « pi » elle-même).
#         niveau_actif : haut ou bas = le niveau qui veut dire « courant passe » (entrée)
#           ou « relais commandé » (sortie). Beaucoup de cartes marchent à l'envers : bas.
#         tirage : aucun, haut ou bas (résistance de tirage des entrées dans le Pi).
#     - type: i2c       une puce sur le bus I2C du Pi.
#         signal : le signal i2c (plus bas) qui mène à la puce (pcf8574, mcp23017, ads1115).
#         broches : repère sur la carte → broche de la puce (K1: P0 ; MCP23017 : A0 à B7).
#         niveau_actif, tirage (aucun ou haut) : comme pour gpio.
#     - type: usb_serie un adaptateur USB (RS485...), reconnu par son numéro de série USB.
#         numero_serie_usb, vitesse_bauds, parite (aucune, paire, impaire),
#         delai_reponse_s (attente maximale d'une réponse).
#
#   La façon dont les cartes de relais et d'entrées 24 V sont reliées au Pi (GPIO direct ou I2C)
#   n'est PAS ENCORE DÉCIDÉE : les deux sont montrées en exemple, le programme sait faire les deux.
cartes:
  pi:
    exemple: true
    description: Raspberry Pi 5, broches GPIO (3,3 V, non isolées)
    tension_max: 3.3
    isolee: false
    liaison:
      type: gpio
      fichier: /dev/gpiochip0
  ads1115:
    exemple: true
    description: Convertisseur analogique ADS1115 (I2C 0x48), 4 voies
    entrees: 4
    tension_max: 3.3
    isolee: false
    liaison:
      type: i2c
      signal: ads1115_bus
  entrees_24v_1:
    exemple: true
    description: Carte d'entrées 24 V optocouplées n° 1
    entrees: 8
    sorties: 0
    tension_max: 24
    isolee: true
    # Exemple de liaison par GPIO direct.
    liaison:
      type: gpio
      fichier: /dev/gpiochip0
      broches:
        E1: GPIO17
        E2: GPIO27
        E3: GPIO22
        E4: GPIO25
        E5: GPIO26
      niveau_actif: bas
      tirage: haut
  relais_1:
    exemple: true
    description: Carte 8 relais n° 1
    entrees: 0
    sorties: 8
    tension_max: 24
    isolee: true
    # Exemple de liaison par une puce I2C PCF8574 (voir le signal relais_1_bus).
    liaison:
      type: i2c
      signal: relais_1_bus
      broches:
        K1: P0
        K2: P1
        K3: P2
        K4: P3
        K5: P4
        K6: P5
        K7: P6
        K8: P7
      niveau_actif: bas
  rs485_ozone:
    exemple: true
    description: Adaptateur USB-RS485 des 2 transmetteurs d'ozone
    tension_max: 5
    isolee: false
    liaison:
      type: usb_serie
      numero_serie_usb: "EXEMPLE-RS485"
      vitesse_bauds: 9600
      parite: aucune
      delai_reponse_s: 0.5
  # 2ᵉ adaptateur USB-RS485, réservé aux 3 cartes de pesée embarquées (RP2040 + HX711 : griffe,
  # préhension, plateau du remplissage), séparé du Modbus de l'ozone (docs/decisions.md, 28/10).
  # Puce à numéro de série unique (FT232 ou CP2102N). Programme des cartes : pesee/.
  # delai_reponse_s : une question et sa réponse durent ≈ 3 ms ; au-delà de ce délai, la carte
  # est dite muette pour cette question (le Pi passe à la suivante).
  rs485_pesee:
    exemple: true
    description: Adaptateur USB-RS485 du bus des pesées (3 cartes RP2040 + HX711)
    tension_max: 5
    isolee: false
    liaison:
      type: usb_serie
      numero_serie_usb: "EXEMPLE-RS485-PESEE"
      vitesse_bauds: 115200
      parite: aucune
      delai_reponse_s: 0.02
  # Carte FluidNC n° 3 (axes du mycélium et du lavage) : le Pi ne la lit pas lui-même (pas de
  # « liaison ») ; ses fins de course et alarmes de pilotes vont à FluidNC, qui les dit au Pi.
  # Entrées 24 V optocouplées (docs/decisions.md, PR n° 3). Repères : EXEMPLES, en attendant le
  # plan de câblage (les vrais numéros de broches vont dans fluidnc/mycelium_lavage.yaml).
  fluidnc_mycelium_lavage:
    exemple: true
    description: Carte FluidNC n° 3 (mycélium et lavage), 6 axes, pilotes externes
    entrees: 10
    sorties: 18
    tension_max: 24
    isolee: true
  # Carte FluidNC n° 2 (chariot de remplissage) : comme la n° 3, le Pi ne la lit pas lui-même.
  # Les vrais numéros de broches vont dans fluidnc/chariot.yaml (plan de câblage attendu).
  fluidnc_chariot:
    exemple: true
    description: Carte FluidNC n° 2 (chariot de remplissage), 6 axes, pilotes externes
    # 14 entrées : 6 fins de course et capteurs d'origine, barrière, 6 alarmes de pilote, 1 libre
    # (EXEMPLE : à confirmer avec le choix de la carte). Le fin de course haut du plateau n'en
    # est plus une : il est en série dans l'arrêt (31/10).
    entrees: 14
    sorties: 18
    tension_max: 24
    isolee: true
  # Carte FluidNC n° 4 (tête de préhension) : comme la n° 3, le Pi ne la lit pas lui-même. Les
  # vrais numéros de broches vont dans fluidnc/prehension.yaml (plan de câblage attendu).
  fluidnc_prehension:
    exemple: true
    description: Carte FluidNC n° 4 (préhension), 6 axes, pilotes externes
    entrees: 10
    sorties: 18
    tension_max: 24
    isolee: true

# Les signaux. Le nom est celui que le code utilise.
#   carte : un nom de la liste « cartes » ci-dessus.
#   broche : le repère écrit sur la carte (E1, K1, gpio.36...), ou une liste pour un bus : [GPIO2, GPIO3].
#   type :
#     entrées : contact (contact sec, reed, microrupteur), pnp, npn (capteurs 3 fils),
#               mesure (valeur analogique) ;
#     sorties : relais, logique (sortie transistor ou GPIO direct) ;
#     bus : i2c, serie (UART, RS485) ;
#     pwm : sortie PWM matérielle du Pi (servo) ; le dossier de Linux et le canal sont dans
#           pi/reglages/machine.yaml (camera_dosage → pwm).
#     pesee : une carte de pesée HX711 lue directement par 2 broches du Pi, dans cet ordre :
#             [DT, SCK]. Carte HX711 alimentée en 3,3 V (sinon DT grillerait la broche du Pi).
#   tension : en volts (pour un relais : la tension qu'il commute).
#   repos : pour contact, pnp, npn, relais seulement : « ouvert » ou « ferme »
#     = l'état du contact quand rien ne se passe (capteur non actionné, relais non commandé).
#   adresse : pour un bus. Obligatoire en I2C (exemple : 0x48). En série, seulement si
#     plusieurs appareils partagent le même fil (RS485). Plusieurs appareils peuvent partager
#     les mêmes broches seulement s'ils sont sur le même type de bus et ont chacun leur adresse.
#   module : un nom de la liste « modules » ci-dessus.
#   appareil : pour un bus, l'appareil au bout (obligatoire en i2c) :
#     sht31, ads1115, pcf8574, mcp23017, transmetteur_modbus, nextion, accelerometre,
#     carte_pesee (carte RP2040 + HX711 du bus des pesées, lue en Modbus : pesee/README.md).
#   fichier : pour un bus sur les broches du Pi, le fichier de Linux qui y donne accès
#     (I2C des GPIO2/3 : /dev/i2c-1).
#   unite, conversion : pour une mesure, son unité et deux points « tension lue → valeur »
#     (volts: [0.5, 3.0], valeurs: [0, -90]) ; sans conversion, la mesure est en volts.
#   modbus : pour un transmetteur_modbus, où lire sa mesure :
#     registre, fonction (3 ou 4), echelle (valeur = nombre lu × échelle), signe (true/false).
#   au_demarrage : pour une entrée contact, pnp ou npn, l'état attendu à la check-list de
#     démarrage : « actionne » ou « repos » (exemple : porte fermée). Sinon, pas de production.
#
# Noms que le programme connaît déjà (tâche 7, fiabilité) :
#   onduleur_sur_batterie : entrée actionnée quand l'onduleur dit « courant coupé » ;
#   battement_pi : sortie que le Pi fait battre tant qu'il va bien (pour un relais
#     « chien de garde » qui mettrait les cartes FluidNC en pause si le Pi se fige).
# (tâche 9, écran de l'armoire) :
#   ecran_nextion : liaison série vers l'écran Nextion ; son « fichier » est l'UART du Pi
#     (GPIO 4/5 = /dev/ttyAMA2, avec « dtoverlay=uart2-pi5 » : voir pi/systeme/essai-ecran.md).
# (tâche 17, poste du fût) :
#   chariot_fut_en_place, reed_panneau_poste_fut, pesee_fut, bouton_pret_fut, voyant_pret_fut.
# (tâche 19, mycélium : tous sur la carte FluidNC n° 3, lus par FluidNC) :
#   fdc_agitateur_garage, fdc_agitateur_dosage, origine_manivelle, alarme_glissiere_agitateur,
#   alarme_manivelle, moteur_glissiere_agitateur, moteur_manivelle.
# (tâche 20, porte-bocal : sur la carte FluidNC n° 3 ; le Pi lit origine_manivelle,
#   verrou_plateau_engage et inclinaison_bocal dans l'état de la carte, et commande les 3 sorties
#   du demi-tour par elle : leurs lettres et numéros sont dans pi/reglages/fluidnc.yaml) :
#   fdc_mors_ouverts, moteur_mors, verrou_plateau_engage, inclinaison_bocal,
#   demi_tour_vers_tete_en_bas, demi_tour_vers_debout, electroaimant_verrou_plateau.
# (tâche 37, préhension : sur la carte FluidNC n° 4 ; le Pi lit contact_tete dans l'état de la
#   carte et commande vanne_vide et electroaimants_capsule par elle : lettres et numéros dans
#   pi/reglages/fluidnc.yaml ; vide_venturi est lu par l'ADS1115 de l'armoire) :
#   contact_tete, fdc_prehension_haut, origine_rotation_tete, alarme_prehension_z,
#   alarme_rotation_tete, moteur_prehension_z, moteur_rotation_tete, vanne_vide,
#   electroaimants_capsule, vide_venturi.
# (tâches 34, 34 bis et 34 quater, remplissage : sur la carte FluidNC n° 2 ; le Pi lit
#   barriere_remplissage, alarme_barre_mur et alarme_barre_allee dans l'état de la carte : lettres
#   dans pi/reglages/fluidnc.yaml ; la balance est pesee_plateau_remplissage, sur le bus des pesées) :
#   fdc_plateau_bas, hall_rotation_plateau, origine_barre_mur, origine_barre_allee,
#   origine_remplissage_y, origine_pousseur, barriere_remplissage, alarme_remplissage_y,
#   alarme_plateau_z, alarme_plateau_a, alarme_barre_mur, alarme_barre_allee, alarme_pousseur,
#   moteur_remplissage_y, moteur_plateau_z, moteur_plateau_a, moteur_barre_mur,
#   moteur_barre_allee, moteur_pousseur.
#   Le fin de course haut du plateau (il coupe la montée vers 0,578) n'est pas dans cette liste :
#   il est câblé en série dans l'arrêt (31/10), comme une sécurité de la machine ; le Pi ne le lit
#   pas, la butée logicielle 0,575 reste.
#   Câbles des capteurs, au bornier du boîtier du chariot (31/10) :
#     câble 1 : 24 V, 0 V, origine_remplissage_y, fdc_plateau_bas, origine_barre_mur,
#               origine_barre_allee, et les 2 fils du fin de course haut (vers l'arrêt) ;
#     câble 2 : 24 V, 0 V, hall_rotation_plateau, origine_pousseur, RS485 A et B
#               (pesee_plateau_remplissage), barriere_remplissage, 1 fil libre.
# (tâche 22, vision) :
#   servo_camera_dosage : servo DS3225 de la caméra du dosage (0° = bocal, 63° = seau), sur une
#     sortie PWM matérielle du Pi (GPIO18 = canal 2 avec « dtoverlay=pwm,pin=18,func=3 », à vérifier :
#     voir pi/systeme/essai-vision.md). Servo alimenté à part (5 à 6,8 V), masse commune au Pi.
# (tâche 15, accéléromètre) :
#   accelerometre_fil : fil série unique vers le RP2040 de l'accéléromètre (half-duplex) ;
#     TX du Pi par une résistance de 1 kΩ, RX directement, les deux sur le même fil.
#     Son « fichier » est l'UART du Pi (GPIO 14/15 = /dev/ttyAMA0, avec « dtparam=uart0=on » :
#     voir accelerometre/essai-etabli.md).
# (tâche 22 bis, cartes de pesée du bus RS485 « rs485_pesee ») :
#   pesee_griffe, pesee_prehension, pesee_plateau_remplissage : leur « adresse » est celle de la
#   carte sur le bus ; elle est copiée dans le programme de chaque carte (pesee/README.md).
#   Étalonnage et ordre de lecture : pi/reglages/pesees.yaml.
signaux:
  reed_panneau_poste_fut:
    exemple: true
    # Contact fermé = panneau long levé = production permise ; ouvert = rabattu ou entre les
    # deux = production refusée (lavage permis seulement contact ouvert).
    description: Panneau long du poste du fût (fermé = levé = production, ouvert = lavage)
    carte: entrees_24v_1
    broche: E1
    type: contact
    tension: 24
    repos: ouvert
    module: poste_fut
  porte_spray:
    exemple: true
    description: Porte de la boîte du spray (pour informer ; la sécurité est câblée)
    carte: entrees_24v_1
    broche: E2
    type: contact
    tension: 24
    repos: ferme
    module: spray
    au_demarrage: repos
  fdc_stockage_haut:
    exemple: true
    description: Fin de course stockage haut
    carte: entrees_24v_1
    broche: E3
    type: pnp
    tension: 24
    repos: ouvert
    module: stockage
  onduleur_sur_batterie:
    exemple: true
    description: Secteur coupé (relais 230 V branché avant l'onduleur, voir docs/decisions.md)
    carte: pi
    broche: GPIO6
    type: contact
    tension: 3.3
    # Le contact du relais est fermé tant que le secteur est là : « actionné » = coupé.
    repos: ferme
    module: armoire
  battement_pi:
    exemple: true
    description: Battement du Pi vers un relais chien de garde (s'il est ajouté)
    carte: pi
    broche: GPIO12
    type: logique
    tension: 3.3
    module: armoire
  servo_camera_dosage:
    exemple: true
    description: Servo DS3225 de la caméra du dosage (impulsion PWM, 50 Hz)
    carte: pi
    broche: GPIO18
    type: pwm
    tension: 3.3
    module: mycelium
  voyant_buzzer:
    exemple: true
    description: Voyant + buzzer « attention » avant un mouvement lancé à distance
    carte: relais_1
    broche: K1
    type: relais
    tension: 24
    repos: ouvert
    module: armoire
  sht31_armoire:
    exemple: true
    description: Température et humidité de l'armoire
    carte: pi
    broche: [GPIO2, GPIO3]
    type: i2c
    tension: 3.3
    adresse: 0x44
    module: armoire
    appareil: sht31
    fichier: /dev/i2c-1
  ads1115_bus:
    exemple: true
    description: Liaison I2C vers le convertisseur ADS1115
    carte: pi
    broche: [GPIO2, GPIO3]
    type: i2c
    tension: 3.3
    adresse: 0x48
    module: armoire
    appareil: ads1115
    fichier: /dev/i2c-1
  # Capteur de vide XGZP6847A de la ventouse (préhension figée le 27/10 : capteur en 3,3 V,
  # sans pont diviseur). Conversion d'EXEMPLE : celle de la fiche pour le capteur 5 V derrière
  # le pont 10 k / 20 k (0 kPa → 0,333 V lus, −40 → 1,40 V, −55 → 1,80 V, −100 → 3,00 V). Pour
  # le capteur 3,3 V, mettre les 2 points de sa notice (tension → kPa) : jamais dans le code.
  # Le zéro est de toute façon recalé à chaque démarrage, vanne fermée.
  vide_venturi:
    exemple: true
    description: Capteur de vide XGZP6847A de la ventouse de la préhension (venturi)
    carte: ads1115
    broche: A0
    type: mesure
    unite: kPa
    conversion:
      volts: [0.333, 3.0]
      valeurs: [0, -100]
    tension: 3.3
    module: prehension
  ecran_nextion:
    exemple: true
    description: Écran Nextion de la porte de l'armoire
    carte: pi
    broche: [GPIO4, GPIO5]
    type: serie
    tension: 3.3
    module: armoire
    appareil: nextion
    fichier: /dev/ttyAMA2
  accelerometre_fil:
    exemple: true
    description: Fil série unique vers l'accéléromètre du chariot Z (RP2040)
    carte: pi
    broche: [GPIO14, GPIO15]
    type: serie
    tension: 3.3
    module: portique
    appareil: accelerometre
    fichier: /dev/ttyAMA0
  relais_1_bus:
    exemple: true
    description: Liaison I2C vers la puce PCF8574 de la carte relais n° 1
    carte: pi
    broche: [GPIO2, GPIO3]
    type: i2c
    tension: 3.3
    adresse: 0x20
    module: armoire
    appareil: pcf8574
    fichier: /dev/i2c-1
  ozone_1:
    exemple: true
    description: Transmetteur d'ozone n° 1 (pour afficher ; la sécurité ozone est câblée)
    carte: rs485_ozone
    broche: [A, B]
    type: serie
    tension: 5
    adresse: 1
    module: armoire
    appareil: transmetteur_modbus
    unite: ppm
    modbus:
      registre: 0
      fonction: 3
      echelle: 0.001
  ozone_2:
    exemple: true
    description: Transmetteur d'ozone n° 2 (pour afficher ; la sécurité ozone est câblée)
    carte: rs485_ozone
    broche: [A, B]
    type: serie
    tension: 5
    adresse: 2
    module: armoire
    appareil: transmetteur_modbus
    unite: ppm
    modbus:
      registre: 0
      fonction: 3
      echelle: 0.001
  chariot_fut_en_place:
    exemple: true
    # Inductif M12 dans la butée d'angle côté portique : voit le bout du châssis à 4 mm
    # quand le chariot est au fond.
    description: Chariot du fût au fond du poste (inductif M12 dans la butée d'angle)
    carte: entrees_24v_1
    broche: E4
    type: pnp
    tension: 24
    repos: ouvert
    module: poste_fut
  bouton_pret_fut:
    exemple: true
    # Plan de commande ; pas encore dans la fiche du module. Les boutons « Prêt » de l'écran
    # et de la page web font la même chose.
    description: Bouton lumineux « Prêt » du poste du fût
    carte: entrees_24v_1
    broche: E5
    type: contact
    tension: 24
    repos: ouvert
    module: poste_fut
  voyant_pret_fut:
    exemple: true
    description: Voyant du bouton « Prêt » (clignote tant que ce n'est pas prêt)
    carte: relais_1
    broche: K2
    type: relais
    tension: 24
    repos: ouvert
    module: poste_fut
  pesee_fut:
    exemple: true
    # Carte HX711 sur le chariot (2 capteurs de pesage de 150/200 kg : berceau + fût + contenu),
    # câble de 10 m à prise magnétique (alimentation, DT, SCK). Prise souvent débranchée :
    # pas de réponse = « pesée débranchée », jamais une erreur qui arrête le Pi.
    description: Pesée du chariot du fût (HX711, broches [DT, SCK])
    carte: pi
    broche: [GPIO20, GPIO21]
    type: pesee
    tension: 3.3
    module: poste_fut
  # Mycélium (fiche du module, validé le 24/10/2026 ; carte n° 3). Les arrêts entre le garage et
  # le dosage (demi-tour) se font au codeur. Repères et types : EXEMPLES (plan de câblage).
  fdc_agitateur_garage:
    exemple: true
    description: Fin de course de la glissière de l'agitateur, au garage (prise d'origine)
    carte: fluidnc_mycelium_lavage
    broche: E1
    type: pnp
    tension: 24
    repos: ouvert
    module: mycelium
