[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidange"
version = "0.1.0"
description = "Programme du Raspberry Pi 5 de la machine « Vidange automatique » de Karulium"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
    # Liaison série avec les cartes FluidNC.
    "pyserial>=3.5,<4",
    # Bus I2C du Pi (ADS1115, SHT31, extenseurs de broches). Écrit en Python seul.
    "smbus2>=0.5,<1",
    # Broches GPIO du Pi 5 (libgpiod, le moyen prévu par Linux). Seulement sous Linux.
    "gpiod>=2.2,<3; sys_platform == 'linux'",
    # API du Pi et page web locale (tâche 8). uvicorn seul, sans les options « standard ».
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    # Écriture du programme des cartes ESP32 par USB (tâche 13), l'outil officiel d'Espressif.
    # Lancé à part (« python -m esptool ») : il n'est jamais chargé dans le programme lui-même.
    "esptool>=5,<6",
]

[project.optional-dependencies]
# Outils pour les tests et le style (pas besoin sur le Pi en production).
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Pour essayer l'API dans les tests (TestClient de FastAPI).
    "httpx>=0.27,<1",
]

[project.scripts]
vidange = "vidange.demarrage:main"
vidange-fluidnc = "vidange.fluidnc.outil:lancer"
vidange-es = "vidange.materiel.outil:lancer"
vidange-registre = "vidange.registre.outil:lancer"
vidange-envois = "vidange.envois.outil:lancer"
vidange-simulateur = "vidange.simulateur.outil:lancer"
vidange-maj = "vidange.mises_a_jour.outil:lancer"
vidange-accelerometre = "vidange.accelerometre.outil:lancer"
vidange-pesee = "vidange.poste_fut.outil:lancer"
vidange-pesees = "vidange.pesees.outil:lancer"
vidange-porte-bocal = "vidange.porte_bocal.outil:lancer"
vidange-prehension = "vidange.prehension.outil:lancer"
vidange-lavage = "vidange.lavage.outil:lancer"

[tool.setuptools.packages.find]
include = ["vidange*"]

[tool.setuptools.package-data]
# La page web est livrée avec le programme.
vidange = ["api/page/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
