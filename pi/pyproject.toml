[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidange"
version = "0.1.0"
description = "Programme du Raspberry Pi 5 de la machine « Vidange automatique » de Karulium"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
    # Liaison série avec les cartes FluidNC.
    "pyserial>=3.5,<4",
    # Bus I2C du Pi (ADS1115, SHT31, extenseurs de broches). Écrit en Python seul.
    "smbus2>=0.5,<1",
    # Broches GPIO du Pi 5 (libgpiod, le moyen prévu par Linux). Seulement sous Linux.
    "gpiod>=2.2,<3; sys_platform == 'linux'",
]

[project.optional-dependencies]
# Outils pour les tests et le style (pas besoin sur le Pi en production).
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
vidange = "vidange.demarrage:main"
vidange-fluidnc = "vidange.fluidnc.outil:lancer"
vidange-es = "vidange.materiel.outil:lancer"
vidange-registre = "vidange.registre.outil:lancer"

[tool.setuptools.packages.find]
include = ["vidange*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
