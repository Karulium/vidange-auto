# MODÈLE du fichier de secrets. NE RIEN ÉCRIRE DE SECRET ICI : ce fichier est dans Git.
#
# Copier ce fichier sous le nom « secrets.yaml » (Git l'ignore) et le remplir.
# Sur le Pi : /etc/vidange/secrets.yaml (voir pi/systeme/installation.md).
# Une valeur vide ("") veut dire « pas encore donné ».

# Clé que l'API du Pi demande (page web, téléphone) : au moins 16 caractères, au hasard.
# En fabriquer une : python3 -c 'import secrets; print(secrets.token_urlsafe(24))'
# Vide : l'API et la page web ne démarrent pas (la machine, elle, tourne quand même).
cle_api: ""

# Jeton du logiciel de culture (tâche 10), pour lui envoyer les cycles. Il se fabrique dans le
# logiciel de culture (un compte « machine », avec son jeton Django REST Framework).
# Vide : les cycles attendent dans la file du Pi.
jeton_culture: ""

# Jeton GitHub pour la mise à jour du programme du Pi (tâche 13), seulement si le dépôt est
