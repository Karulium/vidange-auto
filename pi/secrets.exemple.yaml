# MODÈLE du fichier de secrets. NE RIEN ÉCRIRE DE SECRET ICI : ce fichier est dans Git.
#
# Copier ce fichier sous le nom « secrets.yaml » (Git l'ignore) et le remplir.
# Sur le Pi : /etc/vidange/secrets.yaml (voir pi/systeme/installation.md).
# Une valeur vide ("") veut dire « pas encore donné ».

# (La clé « cle_api » n'existe plus : la page web demande un nom et un mot de passe. Les comptes
# sont dans un autre fichier hors Git, comptes.yaml, à côté de celui-ci : voir comptes.exemple.yaml
# et la commande « vidange compte ».)

# Jeton du logiciel de culture (tâche 10), pour lui envoyer les cycles. Il se fabrique dans le
# logiciel de culture (un compte « machine », avec son jeton Django REST Framework).
# Vide : les cycles attendent dans la file du Pi.
jeton_culture: ""

# Jeton GitHub pour la mise à jour du programme du Pi (tâche 13), seulement si le dépôt est
# privé. Le fabriquer sur GitHub : Settings → Developer settings → Fine-grained tokens, accès
# au seul dépôt « vidange-auto », droit « Contents : Read-only ». Vide : dépôt public.
jeton_github: ""

# ---- Notifications sur le téléphone (tâche 27). Tout est facultatif : vide = canal éteint
# (la check-list le dit, ce n'est pas une erreur). Pas à pas : pi/systeme/essai-notifications.md.
# Ces messages INFORMENT ; ils ne protègent personne (la sécurité est câblée, jamais ici).

# ntfy : application gratuite (serveur public https://ntfy.sh, ou le tien). Le « sujet » est comme
# un mot de passe : qui le connaît lit les messages. Au moins 16 caractères difficiles à deviner
# (lettres, chiffres, - et _). Le même sujet est tapé dans l'appli ntfy du téléphone.
ntfy_serveur: ""
ntfy_sujet: ""
# Seulement si ton serveur ntfy demande une connexion (jeton « tk_... »).
ntfy_jeton: ""
# 2ᵉ liste, pour l'escalade : d'autres sujets ntfy (ceux d'une 2ᵉ personne). Vide : pas de renfort.
ntfy_sujets_renfort: []

# Telegram (en plus, ou à la place) : un bot créé avec @BotFather (son jeton) et le numéro de la
# conversation (chat) où il écrit.
telegram_jeton_bot: ""
telegram_chat: ""
# 2ᵉ liste, pour l'escalade : d'autres numéros de conversation (le bot doit y être invité).
telegram_chats_renfort: []
