# Cartes de pesée embarquées (tâche 22 bis) : une carte RP2040 près de chaque HX711 (griffe,
# préhension, plateau du remplissage) lit son HX711 et répond au Pi sur le bus RS485 des pesées
# (adaptateur « rs485_pesee » de docs/entrees-sorties.yaml), en Modbus RTU.
# La pesée du poste du fût (tâche 17 bis) est sur le même bus : la boîte du poste reçoit par radio
# les mesures du plateau et répond comme une carte (pesee_fut). Elle n'est pas une carte RP2040 :
# les sections « carte » et « broches » ne la concernent pas ; ses programmes (2 ESP32-C3, tâche
# 17 ter, dossier poste_fut_radio/) prennent la section « poste_fut_radio », plus
# « programme → delai_avant_reponse_us » (une affaire de l'adaptateur du Pi, la même pour tous).
#
# Le programme des cartes est dans pesee/ (pesee/README.md). Les sections « carte », « broches »
# et « programme » y sont copiées quand on le fabrique : les changer = refabriquer et recharger
# les cartes. L'adresse de chaque carte et la vitesse du bus viennent de entrees-sorties.yaml.
# Les autres sections ne servent qu'au Pi.
#
# ATTENTION : tout ce fichier est un EXEMPLE (carte, broches et étalonnage pas encore faits).
# Les vraies valeurs se trouvent à l'essai à l'établi (pesee/essai-etabli.md). Quand il sera
# vrai, passer « exemple » à false.
#
# Vérifié au démarrage du Pi et quand on fabrique le programme : une broche prise deux fois, des
# broches série qui ne vont pas ensemble, une carte lue sans étalonnage, une carte de
# entrees-sorties.yaml absente d'ici.

exemple: true

# Carte RP2040, avec le nom que lui donne le Pico SDK
# (pico, waveshare_rp2040_zero, seeed_xiao_rp2040, adafruit_qtpy_rp2040...).
carte: pico

# Broches du RP2040 (numéros GPIO, de 0 à 29), les mêmes sur les 3 cartes.
broches:
  # Le HX711 (alimenté en 3,3 V). Sa broche RATE au 3,3 V : 80 mesures par seconde.
  hx711_dt: 2
  hx711_sck: 3
  # L'émetteur-récepteur RS485 3,3 V (MAX3485, SP3485...). TX et RX d'un même UART du RP2040
  # (UART0 : TX 0, 12, 16, 28 et RX 1, 13, 17, 29 ; UART1 : TX 4, 8, 20, 24 et RX 5, 9, 21, 25).
  rs485_tx: 0
  rs485_rx: 1
  # Ses entrées DE et /RE, reliées ensemble : 1 pour parler, 0 pour écouter.
  rs485_sens: 6
  # Petit voyant de la carte (allumé = HX711 mesure, clignote = HX711 muet). null : pas de voyant.
  voyant: 25

# Le programme des cartes.
programme:
  # Plus de mesure du HX711 depuis ce temps (ms) : « HX711 muet » (capteur débranché ?).
  # À 80 mesures par seconde, il en vient une toutes les 12,5 ms.
  sans_mesure_ms: 100
  # Attente avant de répondre (µs), le temps que l'adaptateur USB-RS485 du Pi repasse en écoute.
  delai_avant_reponse_us: 100
  # Chien de garde du RP2040 (ms) : programme figé plus longtemps = la carte redémarre. Au plus 8000.
  chien_de_garde_ms: 100
  # Fenêtre texte sur le câble USB (essais à l'établi) : une ligne d'état tous les ... (ms).
  periode_affichage_ms: 1000

# Côté Pi : l'ordre des questions, répété sans fin. Une carte peut revenir plusieurs fois par
# tour : la griffe doit avoir 80 mesures par seconde (une question et sa réponse ≈ 3 à 4 ms).
tour:
  - pesee_griffe
  - pesee_prehension
  - pesee_griffe
  - pesee_plateau_remplissage
  - pesee_fut
# Pause entre deux tours (ms) : 1 ms laisse respirer le reste du programme. 0 : aucune.
pause_entre_tours_ms: 1
# Une mesure plus vieille que ça (ms) est refusée par qui la lit (griffe, préhension, dosage) :
# « pesée muette ». Doit rester au-dessus du temps d'un tour.
age_max_ms: 100
# Pesées lues moins souvent que les autres, avec leur propre âge maximal.
lentes:
  # La boîte du poste du fût : le plateau envoie 2 mesures par seconde (moyenne de 5). Une
  # question par seconde au plus, pour ne pas ralentir la griffe (80 mesures par seconde). Une
  # mesure plus vieille que 2 s (âge dit par la boîte + temps depuis la question) : « pesée
  # absente » au poste du fût, jamais un arrêt.
  pesee_fut:
    espacement_s: 1
    age_max_ms: 2000
# Plus aucune carte ne répond (adaptateur débranché...) : nouvel essai toutes les ... (s).
reconnexion_s: 2

# Étalonnage de chaque carte (pesee/essai-etabli.md, étape « étalonnage ») : mesure brute à vide,
# et nombre de points de la mesure brute par kilogramme posé (négatif si le capteur est monté à
# l'envers). Poids = (mesure brute − zero_brut) / brut_par_kg.
etalonnage:
  pesee_griffe:
    zero_brut: 0
    brut_par_kg: 40000
  pesee_prehension:
    zero_brut: 0
    brut_par_kg: 40000
  pesee_plateau_remplissage:
    zero_brut: 0
    brut_par_kg: 40000
  # Plateau du fût : 4 capteurs de 150 kg en parallèle sur un seul HX711. Zéro plateau vide,
  # puis une masse connue d'environ 20 kg au centre (pi/systeme/essai-poste-fut.md). La tare
  # (fût vide) et les bornes du poids sont dans machine.yaml (poste_fut → pesee).
  pesee_fut:
    zero_brut: 0
    brut_par_kg: 10000

# Accu Li-ion 18650 du plateau du fût (recharge sans contact au poste). La carte du plateau se
# coupe d'elle-même vers 3,0 V (protection). EXEMPLES, à confirmer à l'essai.
accu_plateau_fut:
  # 3,6 V et plus : bon. Sous 3,5 V (≈ 20 %) : alerte « recharger le plateau ». Sous 3,3 V
  # (≈ 5 %) : alerte forte « pesée bientôt absente ».
  bon_v: 3.6
  recharger_v: 3.5
  bientot_absente_v: 3.3
  # Plateau au poste depuis plus de 10 min sans le « 5 V de la recharge sans contact présent »
  # (vrai aussi accu plein) : alerte « recharge sans contact en panne ? ».
  sans_recharge_max_s: 600

# Programmes des 2 ESP32-C3 du poste du fût (tâche 17 ter, poste_fut_radio/README.md) : le plateau
# de pesée (HX711, accu, radio) et la boîte du poste (radio, bus RS485). Copié dans les 2
# programmes quand on les fabrique : le changer = refabriquer et recharger les 2 cartes. L'adresse
# de la boîte sur le bus et la vitesse du bus viennent de entrees-sorties.yaml (pesee_fut).
# EXEMPLES : les broches dépendent de la carte ESP32-C3 achetée (ici une « ESP32-C3 SuperMini »).
poste_fut_radio:
  # Radio ESP-NOW, directe, sans Wi-Fi ni réseau. Chaque carte PREND l'adresse écrite ici (rien à
  # relever sur les cartes) : le plateau n'envoie qu'à l'adresse de la boîte, la boîte n'écoute que
  # celle du plateau. Une carte changée : recharger le même programme, c'est tout.
  radio:
    adresse_plateau: "02:50:46:00:00:01"
    adresse_boite: "02:50:46:00:00:02"
    # Canal radio (1 à 13), le même pour les deux. À changer si un Wi-Fi voisin gêne.
    canal: 1
    # Puissance d'émission (dBm, 2 à 20). 8 suffit pour 1 m, use moins l'accu, et beaucoup de
    # petites cartes ESP32-C3 émettent mal à pleine puissance.
    puissance_dbm: 8

  plateau:
    # Broches de l'ESP32-C3 du plateau (numéros GPIO). Jamais 11 à 17 (mémoire) ni 18, 19 (USB).
    broches:
      # Le HX711 (alimenté en 3,3 V, broche RATE à la masse : 10 mesures par seconde).
      hx711_dt: 6
      hx711_sck: 7
      # Contact reed de réveil (l'aimant de la boîte du poste), entre la broche et le 0 V :
      # fermé = au poste. Une broche de 0 à 5 (seules elles réveillent la carte endormie).
      reed: 3
      # Pont diviseur de l'accu (deux résistances égales de 220 kΩ, 100 nF vers le 0 V) : une
      # entrée analogique, broche 0 à 4.
      accu: 4
      # Le 5 V de la recharge sans contact, et celui de l'USB-C de secours, chacun par un pont
      # diviseur (10 kΩ côté 5 V, 15 kΩ vers le 0 V : 5 V → 3 V) : 1 = présent.
      recharge_5v: 5
      usb_5v: 10
      # Petit voyant de la carte (un éclair à chaque trame reçue par la boîte). null : aucun.
      voyant: 8
    # Voyant allumé quand sa broche est à 0 (le bleu de l'ESP32-C3 SuperMini).
    voyant_actif_bas: true
    # Cadence du HX711 (sa broche RATE à la masse : 10). Sert à vérifier les chiffres d'en dessous.
    mesures_par_seconde_hx711: 10
    # Une trame radio toutes les 500 ms, avec la moyenne des 5 dernières mesures.
    periode_trame_ms: 500
    moyenne_de: 5
    # Plus de mesure du HX711 depuis ce temps (ms) : « HX711 muet ». Au réveil, le HX711 met
    # environ 400 ms pour sa première mesure.
    sans_mesure_ms: 500
    # Reed ouvert (plateau sorti du poste) depuis ce temps (s) : la carte s'endort.
    sommeil_apres_s: 30
    # Pont diviseur de l'accu : tension de l'accu / tension sur la broche (2 résistances égales :
    # 2). À corriger à l'essai avec un voltmètre (poste_fut_radio/essai-materiel.md).
    rapport_pont_accu: 2.0
    # Niveau de l'accu Li-ion 18650 : (tension en mV, %), à vide, tension croissante. Le plateau
    # calcule le % entre deux points (registre 10). Les seuils des alertes sont plus haut
    # (accu_plateau_fut, en volts) : 3,3 V ≈ 5 %, 3,5 V ≈ 20 %.
    courbe_accu:
      - [3000, 0]
      - [3300, 5]
      - [3500, 20]
      - [3600, 30]
      - [3700, 45]
      - [3800, 60]
      - [3900, 72]
      - [4000, 83]
      - [4100, 93]
      - [4200, 100]
    # Chien de garde (ms) : programme figé plus longtemps = la carte redémarre.
    chien_de_garde_ms: 2000
    # Fenêtre texte sur le câble USB (essais) : une ligne d'état tous les ... (ms).
    periode_affichage_ms: 1000

  boite:
    # Broches de l'ESP32-C3 de la boîte du poste. L'émetteur-récepteur RS485 3,3 V (MAX3485) :
    # DI ← rs485_tx, RO → rs485_rx, DE et /RE reliées ensemble ← rs485_sens (1 = parler).
    broches:
      rs485_tx: 21
      rs485_rx: 20
      rs485_sens: 10
      # Voyant : allumé = trames du plateau reçues ; clignote = radio muette. null : aucun.
      voyant: 8
    voyant_actif_bas: true
    # Rien reçu du plateau depuis ce temps (ms) : bit « radio muette » (registre 4, valeur 4).
    radio_muette_ms: 2000
    chien_de_garde_ms: 1000
    periode_affichage_ms: 1000
