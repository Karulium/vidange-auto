# Simulateur de cycle (jumeau numérique, version 0) : la machine imaginaire sur laquelle le vrai
# chef d'orchestre rejoue un module, pour sortir le planning (qui fait quoi, quand) et le temps total.
# Lancer : vidange-simulateur exemple   (voir pi/README.md, partie « Simulateur de cycle »)
#
# ATTENTION : tout ce fichier est un EXEMPLE (valeurs inventées), comme machine.yaml.
# Plus tard, vitesses et accélérations viendront des réglages des cartes (fluidnc/) et les
# durées seront recalées sur les vrais temps mesurés. Quand le fichier sera vrai, passer
# « exemple » à false.
#
# Vérifié au démarrage : un axe ou une position absents de machine.yaml, un nombre mal écrit.
# Vérifié au lancement d'une simulation : capteurs (docs/entrees-sorties.yaml) et étapes citées.

exemple: true

# La simulation saute d'un événement au suivant (fin d'un mouvement, Go, capteur) ;
# elle n'avance jamais de plus que ce pas (s), pour voir les délais dépassés.
pas_max_s: 1
# Au-delà de ce temps simulé (s), on s'arrête : le cycle est bloqué (il attend quelque chose
# qui n'arrive jamais). Le plus long scénario, « stockage », dure ≈ 2 h 30 ; le lot de 20 seaux du
# cycle, avec un bocal neuf de semence par seau (tâche 19 quater, ≈ 2 min 45 de plus chacun), ≈ 3 h 50.
duree_max_s: 21600
# Temps que met Karulium à donner le Go quand une étape le demande (s). 0 : tout de suite.
delai_go_s: 20

# Mouvement de chaque axe de machine.yaml : vitesse (m/s) et accélération (m/s²).
# Un déplacement de plusieurs axes dure autant que celui de l'axe le plus long à arriver.
axes:
  exemple_x: {vitesse: 0.5, acceleration: 1.0}
  exemple_y: {vitesse: 0.5, acceleration: 1.0}
  exemple_z: {vitesse: 0.3, acceleration: 0.5}
  # Griffe : ses vitesses plus lentes (machine.yaml → griffe → vitesses) passent avant celles-ci.
  pont_x: {vitesse: 0.25, acceleration: 0.5}
  chariot_y: {vitesse: 0.25, acceleration: 0.5}
  griffe_z: {vitesse: 0.15, acceleration: 0.5}
  griffe_a: {vitesse: 90, acceleration: 180}
  griffe_b: {vitesse: 0.05, acceleration: 0.5}
  # Agitateur du mycélium (fixe) : ses vitesses (machine.yaml → mycelium → vitesses) passent avant
  # celles-ci. Manivelle en °/s (300 tr/min = 1800 °/s).
  manivelle: {vitesse: 1800, acceleration: 3600}
  # Tête de préhension : ses vitesses plus lentes (machine.yaml → prehension → vitesses)
  # passent avant celles-ci.
  prehension_z: {vitesse: 0.15, acceleration: 0.5}
  prehension_a: {vitesse: 90, acceleration: 180}
  # Brosses du lavage (°/s) : noyau jusqu'à 200 tr/min, couronne 100 tr/min.
  lavage_noyau: {vitesse: 1200, acceleration: 2400}
  lavage_couronne: {vitesse: 600, acceleration: 1200}
  # Chariot de remplissage : ses vitesses (machine.yaml → remplissage → vitesses) passent avant
  # celles-ci. Rotation du plateau en °/s.
  remplissage_y: {vitesse: 0.2, acceleration: 0.5}
  plateau_z: {vitesse: 0.05, acceleration: 0.3}
  plateau_a: {vitesse: 60, acceleration: 120}
  barres: {vitesse: 0.08, acceleration: 0.5}
  barre_allee: {vitesse: 0.08, acceleration: 0.5}
  pousseur: {vitesse: 0.1, acceleration: 0.5}

# Position (machine.yaml) des axes au départ. Sans « depart », chaque axe est au début de sa course.
# Les axes que la position ne cite pas sont au début de leur course.
depart: griffe_attente

# Le substrat du fût imaginaire, pour la griffe : densité vraie (la griffe part de sa densité par
# défaut et doit apprendre celle-ci), prises plus légères près de la paroi et au fond, part qui
# retombe quand le godet s'entrouvre, charge pendue godet vide.
griffe:
  densite_kg_l: 0.62
  paroi_rayon_m: 0.18
  facteur_paroi: 0.8
  fond_hauteur_m: 0.04
  facteur_fond: 0.6
  entrouvrir_rendu: 0.15
  charge_vide_n: 120

# Le mycélium imaginaire : grains qui tombent quand la manivelle tourne (bocal tête en bas, seau
# dessous), en kg/s à la vitesse d'agitation (moins vite quand elle tourne plus lentement), mycélium d'un bocal neuf, durées du demi-tour du bocal (≈ 2,3 s, fiche du
# Porte-bocal ; le vrai porte-bocal tourne sur un faux FluidNC) et d'un trajet du chariot de
# remplissage, et les seaux à doser (un seau A en 4 couches, puis 2 petits seaux B avec un seul
# bocal). Le bocal attend manivelle en bas (position agitateur_attente de machine.yaml).
mycelium:
  debit_kg_s: 0.02
  bocal_kg: 0.9
  demi_tour_s: 2.3
  chariot_s: 6
  seaux:
    - {seau: S0001, format: seau_a, variete: pleurote_grise}
    - {seau: S0002, format: seau_b, variete: pleurote_grise}
    - {seau: S0003, format: seau_b, variete: pleurote_grise}

# Les objets imaginaires de la préhension (scénario « prehension ») : où les prendre, où les
# poser (axe de la tête, cote de la face au contact), vide atteint sur un objet, durée d'un
# geste des mors du porte-bocal. La tête part en haut (position prehension_haut).
prehension:
  vide_kpa: -70
  seau: {x: 1.6, y: 0.6, contact_z: 0.6}
  seau_pose: {x: 1.9, y: 0.6, contact_z: 0.6}
  couvercle: {x: 1.6, y: 0.75, contact_z: 0.8}
  couvercle_pose: {x: 1.9, y: 0.75, contact_z: 0.8}
  bocal: {x: 1.0, y: 0.75, contact_z: 0.95}
  capsule: {x: 1.5, y: 0.5, contact_z: 0.85}
  vissage: {x: 1.7, y: 0.5, contact_z: 0.9}
  mors_s: 3

# L'eau imaginaire du fût de lavage (scénario « lavage ») : le flotteur est haut au-dessus de
# 45 L ; débits de l'eau du réseau (≈ 4 min pour remplir), de la pompe vers la bonde, du rinçage
# (≈ 0,5 L en 5 s). Les seaux retournés à laver : format, et où la tête les prend et les repose
# (axe, face au contact de leur fond), le long du couloir du seau retourné (y 0,74).
lavage:
  niveau_flotteur_l: 45
  debit_eau_l_s: 0.2
  debit_pompe_l_s: 0.5
  debit_rincage_l_s: 0.1
  seaux:
    - {format: seau_a, x: 1.3, y: 0.74, contact_z: 0.95}
    - {format: seau_b, x: 1.3, y: 0.74, contact_z: 0.90}
    - {format: seau_c, x: 1.3, y: 0.74, contact_z: 0.935}
  # Scénario « lavage_couvercles » : 2 couvercles (A, B), pris et reposés à leur place (le
  # rangement est au Stockage) ; les barres du retourneur bougent en 2 s.
  couvercles:
    - {format: seau_a, x: 1.6, y: 0.75, contact_z: 0.8}
    - {format: seau_b, x: 1.6, y: 0.75, contact_z: 0.8}
  barres_s: 2
  # Scénario « lavage_bocaux » : 2 bocaux vides (retournés) et une capsule.
  bocaux:
    - {sorte: bocal_vide, x: 1.4, y: 0.75, contact_z: 0.95}
    - {sorte: bocal_vide, x: 1.4, y: 0.75, contact_z: 0.95}
    - {sorte: capsule, x: 1.5, y: 0.5, contact_z: 0.85}

# Les seaux imaginaires du remplissage (scénario « remplissage ») : où la tête prend les seaux
# vides (le Stockage n'est pas écrit) et où elle rend le seau du dessus d'une prise double ; durée
# d'un versement de la griffe (le seau tourne) ; les seaux : un seau A posé avec un 2e seau
# emboîté (prise double), puis un petit seau B. Le Mycélium dose chaque couche (bocaux de la
# partie « mycelium » plus haut). Le chariot part du poste (position remplissage_poste).
remplissage:
  stockage: {x: 1.6, y: 0.6, contact_z: 0.6}
  rendu: {x: 1.9, y: 0.6, contact_z: 0.6}
  versement_s: 20
  # Deux seaux emboîtés : le fond de celui du dessous est ≈ 3 cm plus bas (décisions, point 5).
  double_plus_bas_m: 0.03
  seaux:
    - {seau: S0101, format: seau_a, variete: pleurote_grise, file: file_1, prise_double: true, anse_deg: 10}
    - {seau: S0102, format: seau_b, variete: pleurote_grise, file: file_3, anse_deg: 70}

# Le stockage imaginaire (scénario « stockage ») : 4 piles de seaux A chargées, 5 + 5 + 5 + 4
# (rangée y 0,84 vidée dans l'ordre pile_1, pile_2, pile_4, puis pile_3 dans la rangée 0,53), et
# 19 seaux A à remplir : le 3e est posé avec un 2e seau emboîté (prise double, le seau du dessus
# rendu à sa pile). Le Stockage choisit la place de chaque seau : le tiroir (4 + 5 + 5 = 14), puis la bande
# du haut (4), soit 18 seaux A par lot ; le 19e attend que le tiroir et la bande soient vidés.
stockage:
  # Lot de 26 seaux A (stockage agrandi de 43 cm) : le tiroir porte déjà 13 seaux (files 1 et 2
  # pleines), les 19 seaux ci-dessous en rangent 13 (file 3, puis la bande du haut), puis la
  # pause « plus de place », puis les 6 derniers dans la file 1.
  files_pleines: {file_1: 6, file_2: 7}
  piles:
    pile_1: {format: seau_a, nombre: 5}
    pile_2: {format: seau_a, nombre: 5}
    pile_4: {format: seau_a, nombre: 5}
    pile_3: {format: seau_a, nombre: 4}
  seaux:
    - {seau: S0201, format: seau_a, variete: pleurote_grise}
    - {seau: S0202, format: seau_a, variete: pleurote_grise}
    - {seau: S0203, format: seau_a, variete: pleurote_grise, prise_double: true}
    - {seau: S0204, format: seau_a, variete: pleurote_grise}
    - {seau: S0205, format: seau_a, variete: pleurote_grise}
    - {seau: S0206, format: seau_a, variete: pleurote_grise}
    - {seau: S0207, format: seau_a, variete: pleurote_grise}
    - {seau: S0208, format: seau_a, variete: pleurote_grise}
    - {seau: S0209, format: seau_a, variete: pleurote_grise}
    - {seau: S0210, format: seau_a, variete: pleurote_grise}
    - {seau: S0211, format: seau_a, variete: pleurote_grise}
    - {seau: S0212, format: seau_a, variete: pleurote_grise}
    - {seau: S0213, format: seau_a, variete: pleurote_grise}
    - {seau: S0214, format: seau_a, variete: pleurote_grise}
    - {seau: S0215, format: seau_a, variete: pleurote_grise}
    - {seau: S0216, format: seau_a, variete: pleurote_grise}
    - {seau: S0217, format: seau_a, variete: pleurote_grise}
    - {seau: S0218, format: seau_a, variete: pleurote_grise}
    - {seau: S0219, format: seau_a, variete: pleurote_grise}

# Le lot du mode seaux (« vidange-simulateur cycle », tâche 45) : joué par le MÊME code que le
# programme principal de la machine (vidange.cycle). Un lot complet de seaux A (26 = 20 au tiroir et
# 6 sur la bande du haut) : la file 1 du tiroir est déjà pleine (6), les 20 seaux vides sont sur 4
# piles de 5 ; le 3e est posé avec un 2e seau emboîté (prise double). Fin de lot : le tiroir est
# vidé (scénario « cycle » plus bas). Les seaux s'appellent S0301, S0302...
cycle:
  format: seau_a
  variete: pleurote_grise
  seaux: 20
  prefixe: S
  premier: 301
  piles:
    pile_1: {format: seau_a, nombre: 5}
    pile_2: {format: seau_a, nombre: 5}
    pile_4: {format: seau_a, nombre: 5}
    pile_3: {format: seau_a, nombre: 5}
  files_pleines: {file_1: 6}
  prises_doubles: [3]
  anse_deg: 30
  # La pile de couvercles du stockage imaginaire (tâche 41 bis) : de quoi couvrir le lot et son pas
  # d'empilage (EXEMPLES ; à mesurer sur les vrais couvercles).
  couvercles: 24
  pas_couvercles_m: 0.009
  # Le bocal neuf de semence (tâche 19 quater) : bocaux de la variété du lot sur les premières places
  # de semence, capsules déjà rangées, couvercles percés ; la capsule se libère après 200° de
  # dévissage (la fiche prévoit l'essai à 120°, puis tous les 60°), le couvercle percé cale à 270°
  # de vissage, la tôle se comprime de 1 mm sous 80 N (EXEMPLES : machine imaginaire).
  bocal_neuf:
    bocaux: 6
    capsules: 0
    couvercles_perces: 18
    devisse_deg: 200
    filet_deg: 270
    raideur_n_m: 80000
    # Un bocal sert un seau, et le lot en a 20 : plus que les 18 places de semence et que les 18 capsules
    # de la boîte. Karulium recharge donc entre deux bocaux (machine imaginaire seulement).
    reapprovisionne: true

# L'enceinte imaginaire du Nettoyage (scénarios « fermeture_purge », « purge_trop_longue »,
# « nuit_uv_ozone », « fuite_ozone ») : le store ouvert au départ met 25 s à descendre (2,18 m à
# ≈ 9 cm/s), son reed rebondit 0,6 s (toutes les 0,15 s). Particules : 12 µg/m³ dans le conteneur,
# 45 dedans store ouvert ; store fermé, le HEPA les fait tendre vers 0,3 × dehors en 90 s
# (constante de temps à 10 V). Surpression : 24 Pa à 10 V (12 Pa au « normal » de 5 V), constante
# 20 s ; HEPA colmaté : 25 % (6 Pa au plein : la purge n'atteint jamais 8 Pa). Ozone : + 0,1 ppm/s
# générateur alimenté (≈ 12 ppm en 2 min : le capteur reste au plafond, 10 ppm), demi-vie 20 min
# (ventilateur coupé). Tout est d'EXEMPLE.
nettoyage:
  course_s: 25
  rebond_s: 0.6
  rebond_pas_s: 0.15
  particules_dehors: 12
  particules_ouvert: 45
  particules_fond: 0.3
  constante_particules_s: 90
  pression_10v_pa: 24
  constante_pression_s: 20
  facteur_hepa_colmate: 0.25
  montee_ozone_ppm_s: 0.1
  demi_vie_ozone_s: 1200

# La tête du micropore imaginaire (scénario « remplissage », tâche 40) : ses gestes appris (sur la
# vraie machine : donnees/micropore-appris.yaml, appris par Karulium avec vidange-micropore) et
# l'angle où la caméra voit le premier trou de chaque rangée au tour de repérage. La fausse paroi
# du seau est là où le contact a été appris (tête escamotée à 40°, 0,785 mm par degré).
micropore:
  appris:
    escamote_deg: 40
    formats:
      seau_a: {approche_deg: 73.12, contact_deg: 75.67, appui_deg: 84.59, contact_mm: 49, camera_rouleau_deg: 32}
      seau_b: {approche_deg: 79.49, contact_deg: 82.04, appui_deg: 90.96, contact_mm: 44, camera_rouleau_deg: 32}
      seau_c: {approche_deg: 62.93, contact_deg: 65.48, appui_deg: 74.39, contact_mm: 57, camera_rouleau_deg: 32}
      seau_d: {approche_deg: 70.57, contact_deg: 73.12, appui_deg: 82.04, contact_mm: 51, camera_rouleau_deg: 32}
  premier_trou_deg: 20

# Le couvercle imaginaire de la Fermeture des seaux (tâche 41) : il touche le rouleau à Hc (+ écart)
# bras au travail, et pousse de tant de newtons par mètre de plateau au-dessus (10 000 N/m : 60 N au
# clip, à Hf, pour un clip de 6 mm).
fermeture:
  raideur_n_par_m: 10000
  ecart_contact_m: 0.0

# L'entonnoir imaginaire (tâche 43) : le lot de bocaux à remplir (noms du quinconce du Stockage ;
# le Pi choisit l'ordre) et la durée du versement de la griffe dans un bocal.
entonnoir:
  bocaux: [bocal_0_2, bocal_0_0, bocal_0_1, bocal_1_0]
  verse_s: 5

# Capteurs (entrées tout-ou-rien de docs/entrees-sorties.yaml) actionnés au départ.
capteurs_actionnes: []

# Ce qui change pendant le cycle : « attente_s » secondes après le début de l'étape « apres »
# (module.etape ; sans « apres » : après le début de la simulation), le capteur est actionné
# (actionne: true) ou ne l'est plus (false). Une pesée peut aussi changer :
# « pesee: pesee_fut » avec « kg: 160 » (poids lu, radio du plateau qui parle),
# « radio_muette: true » (plateau endormi ou accu vide) ou « debranchee: true » (la boîte du poste
# ne répond plus). Une mesure aussi (analogique ou ozone, dans l'unité du signal) :
# « mesure: ozone_dehors » avec « valeur: 0.4 ».
evenements:
  # Karulium ferme le panneau du poste du fût 10 s après le lancement du module d'exemple.
  - apres: exemple.aller_au_repos
    attente_s: 10
    capteur: reed_panneau_poste_fut
    actionne: true

# Scénarios nommés : ils remplacent « capteurs_actionnes » et « evenements » du haut.
# Lancer : vidange-simulateur poste_fut   (scénario « echange_fut » par défaut),
#         vidange-simulateur griffe      (scénario « vidange_fut » par défaut),
#         vidange-simulateur mycelium    (scénario « dosage_mycelium » par défaut),
#         vidange-simulateur prehension  (scénario « prehension » par défaut),
#         vidange-simulateur entonnoir   (scénario « entonnoir » par défaut),
#         vidange-simulateur lavage      (scénario « lavage » par défaut),
#         vidange-simulateur lavage_couvercles, vidange-simulateur lavage_bocaux,
#         vidange-simulateur remplissage (scénario « remplissage » par défaut),
#         vidange-simulateur nettoyage_purge, nettoyage_purge_longue, nettoyage_nuit,
#         nettoyage_fuite (scénarios « fermeture_purge », « purge_trop_longue », « nuit_uv_ozone »,
#         « fuite_ozone »).
scenarios:
  # Échange d'un fût au poste (tâche 17 bis) : le plateau du fût vide s'en va, le suivant arrive.
  echange_fut:
    # Au départ, le plateau du fût vide est au fond, sa radio parle : 36 kg lus (fût vide et son
    # couvercle, 33,4 kg, et un reste de substrat de 2,6 kg).
    capteurs_actionnes: [plateau_fut_en_place]
    evenements:
      - attente_s: 0
        pesee: pesee_fut
        kg: 36
      # Karulium relève le volet, desserre les freins et sort le plateau.
      - attente_s: 40
        capteur: plateau_fut_en_place
        actionne: false
      # Loin de l'aimant du poste, le plateau se rendort 30 s plus tard : radio muette.
      - attente_s: 70
        pesee: pesee_fut
        radio_muette: true
      # Fût plein sorti du culbuteur, posé debout sur le plateau (soupape enlevée) ; plateau
      # poussé au fond 5 min plus tard.
      - attente_s: 340
        capteur: plateau_fut_en_place
        actionne: true
      # L'aimant du poste réveille le plateau : sa radio parle de nouveau (129 kg lus : 95,6 kg
      # de substrat et 33,4 kg de tare).
      - attente_s: 342
        pesee: pesee_fut
        kg: 129
      # 2 roulettes freinées, volet rabattu, panneau levé, puis « Prêt ».
      - attente_s: 430
        capteur: bouton_pret_fut
        actionne: true
      - attente_s: 431
        capteur: bouton_pret_fut
        actionne: false
  # Le même échange, mais la radio du plateau reste muette (accu vide) : « pesée absente »
  # (alerte, jamais un arrêt), « Prêt » accepté quand même, cycle sans poids du fût plein.
  echange_fut_sans_pesee:
    capteurs_actionnes: []
    evenements:
      - attente_s: 0
        pesee: pesee_fut
        radio_muette: true
      - attente_s: 10
        capteur: plateau_fut_en_place
        actionne: true
      - attente_s: 30
        capteur: bouton_pret_fut
        actionne: true
      - attente_s: 31
        capteur: bouton_pret_fut
        actionne: false
  # Vidange d'un fût par la griffe : plateau au fond, panneau levé (production), 93,4 kg lus
  # (60 kg de substrat et 33,4 kg de tare), « Prêt » au bout de 5 s ; puis prises, couches,
  # passe de fond, fût vide.
  vidange_fut:
    capteurs_actionnes: [plateau_fut_en_place, reed_panneau_poste_fut]
    evenements:
      - attente_s: 0
        pesee: pesee_fut
        kg: 93.4
      - attente_s: 5
        capteur: bouton_pret_fut
        actionne: true
      - attente_s: 6
        capteur: bouton_pret_fut
        actionne: false
  # Dosage du mycélium (seaux de la partie « mycelium » plus haut) : aucun capteur ne change.
  dosage_mycelium: {}
  # Gestes de la préhension (objets de la partie « prehension » plus haut) : plateau du fût au
  # fond, panneau du poste du fût rabattu (contact ouvert) : la tête peut descendre au
  # porte-bocal, sous x 0,71. Prise et pose d'un seau, d'un couvercle, d'un bocal, pose et
  # reprise au porte-bocal, vissage d'une capsule.
  prehension:
    capteurs_actionnes: [plateau_fut_en_place]
  # Lavage de 3 seaux (A, B, C) : plateau du fût au fond, panneau du poste du fût rabattu (contact
  # ouvert) ; remplissage, 3 seaux lavés, vidange, série finie.
  lavage:
    capteurs_actionnes: [plateau_fut_en_place]
  # Lavage de 2 couvercles avec retournement (mêmes capteurs) : retourneur vérifié, remplissage,
  # chaque couvercle lavé sur ses 2 faces, vidange, série finie.
  lavage_couvercles:
    capteurs_actionnes: [plateau_fut_en_place]
  # Lavage de 3 bocaux et capsules au lave-bocal (mêmes capteurs) : lave-bocal confirmé (Go),
  # bocaux lavés, vidange, lave-bocal enlevé (Go), série finie.
  lavage_bocaux:
    capteurs_actionnes: [plateau_fut_en_place]
  # Remplissage de 2 seaux (partie « remplissage » plus haut) : plateau du fût au fond. Seau A posé
  # avec un 2e seau emboîté (barrière coupée : prise double séparée, le seau du dessus rendu),
  # anse orientée, centré, 4 couches versées et dosées (Mycélium), rangé ; puis un seau B.
  remplissage:
    capteurs_actionnes: [plateau_fut_en_place]
  # Stockage (partie « stockage » plus haut) : plateau du fût au fond, boucle du stockage fermée.
  # 14 seaux remplis et rangés (4 + 5 + 5), puis « plus de place » : 1 min plus tard, Karulium
  # tire le tiroir (boucle ouverte), le vide et le remet 5 min après ; Go (tiroir vide), et le
  # 15e seau est rangé dans la file 1 vidée.
  stockage:
    capteurs_actionnes: [plateau_fut_en_place, boucle_stockage]
    evenements:
      - apres: remplissage.vider_le_tiroir
        attente_s: 60
        capteur: boucle_stockage
        actionne: false
      - apres: remplissage.vider_le_tiroir
        attente_s: 360
        capteur: boucle_stockage
        actionne: true
  # Lot du mode seaux (partie « cycle » plus haut) : plateau du fût au fond, boucle du stockage
  # fermée. Fin de lot : 1 min après la demande, Karulium tire le tiroir, le vide et le remet 5 min
  # après ; Go (tiroir vide).
  cycle:
    capteurs_actionnes: [plateau_fut_en_place, boucle_stockage]
    evenements:
      - apres: remplissage.vider_le_tiroir
        attente_s: 60
        capteur: boucle_stockage
        actionne: false
      - apres: remplissage.vider_le_tiroir
        attente_s: 360
        capteur: boucle_stockage
        actionne: true
  # Nettoyage (tâche 38). Store ouvert au départ, porte du spray fermée, panneau long du poste du fût
  # levé (contact fermé, la position normale ; ce n'est pas une condition de la nuit : la fuite part
  # panneau rabattu, contact ouvert, pour le montrer).
  # Karulium referme le store (le reed rebondit), purge au plein jusqu'à ses 3 conditions (au moins
  # 7 min), puis il rouvre le store.
  fermeture_purge:
    capteurs_actionnes: [reed_panneau_poste_fut]
  # HEPA colmaté : la surpression reste sous 8 Pa, alerte à 20 min (dosage toujours refusé), puis
  # Karulium passe outre (Go, noté au journal).
  purge_trop_longue:
    capteurs_actionnes: [reed_panneau_poste_fut]
  # Entonnoir à bocaux (tâche 43) : Karulium pose l'entonnoir sur le premier bocal (Go), la caméra
  # le voit, la griffe verse, l'entonnoir passe de bocal en bocal, Karulium l'enlève à la fin (Go).
  entonnoir:
    capteurs_actionnes: []
  # Fermeture, purge, mode UV-ozone, nuit lancée tout de suite (Go) : 2 min de génération, 2 h de
  # contact, retour sous 0,1 ppm stable 15 min ; le store se rouvre ensuite.
  nuit_uv_ozone:
    capteurs_actionnes: [reed_panneau_poste_fut]
  # Panneau du poste rabattu (contact ouvert) : la nuit part quand même ; 30 s après le début de
  # la génération, le capteur du dehors lit 0,4 ppm.
  fuite_ozone:
    capteurs_actionnes: []
    evenements:
      - apres: nettoyage_fuite.generation
        attente_s: 30
        mesure: ozone_dehors
        valeur: 0.4
