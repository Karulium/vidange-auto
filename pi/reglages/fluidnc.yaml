# Cartes FluidNC (ESP32, axes) et leur liaison USB avec le Pi.
#
# ATTENTION : les numéros de série ci-dessous sont des EXEMPLES. Pour lire les vrais,
# brancher les cartes sur le Pi et lancer : vidange-fluidnc lister
# (procédure complète : fluidnc/essai-liaison.md). Quand ils sont vrais, passer « exemple » à false.
#
# Chaque carte est reconnue par le numéro de série de son USB, jamais par l'ordre des ports
# (/dev/ttyACM0, /dev/ttyACM1... peuvent s'échanger à chaque démarrage).
# Toujours écrire le numéro entre guillemets.
#
# Vérifié au démarrage : deux cartes avec le même numéro, un délai de silence trop court.

exemple: true

liaison:
  vitesse_bauds: 115200
  # Tampon de réception de la carte, en octets (128 comme Grbl : sans risque avec FluidNC).
  taille_tampon: 128
  # Demande de l'état (positions, alarme) toutes les :
  periode_etat_s: 0.2
  # Rien reçu pendant ce temps = carte muette : la liaison est fermée puis reprise.
  delai_silence_s: 2
  # Attente entre deux essais de connexion (câble débranché, carte éteinte).
  delai_reconnexion_s: 2

cartes:
  portique:
    description: Axes du portique
    numero_serie_usb: "EXEMPLE-PORTIQUE"
    # Alarmes des pilotes du pont (X1, X2), du chariot (Y) et du Z de la griffe : broches macro0 à
    # macro3, sans macro (lettres 0 à 3). Frein du Z de la griffe : sortie digital0 (commandée =
    # desserré). Origines du godet et de la rotation de la griffe : fins de course des axes B et A
    # (lettres B et A). « A » est montré quand le fanion est LIBRE (A de 0 à +180°) : sa broche est
    # inversée dans fluidnc/portique.yaml, pour que « $HA » finisse toujours en tournant en +.
    # À VÉRIFIER à l'essai de la carte (pi/systeme/essai-portique.md).
    entrees:
      alarme_pont_x1: "0"
      alarme_pont_x2: "1"
      alarme_chariot_y: "2"
      alarme_griffe_z: "3"
      origine_godet_griffe: B
      origine_rotation_griffe: A
    sorties:
      frein_griffe_z: 0
  chariot:
    description: Axes du chariot de remplissage
    numero_serie_usb: "EXEMPLE-CHARIOT"
    # Barrière lumineuse du chariot (broche macro0, lettre 0) et alarmes ALM des pilotes des 2
    # barres : côté mur (broche macro1, lettre 1), côté allée (broche macro2, lettre 2), sans
    # macro. À VÉRIFIER à l'essai de la carte (pi/systeme/essai-remplissage.md).
    entrees:
      barriere_remplissage: "0"
      alarme_barre_mur: "1"
      alarme_barre_allee: "2"
      # EXEMPLE : les 4 autres ALM (avance, plateau Z, plateau A, pousseur) en OU câblé sur la
      # macro3 (il n'y a que 4 entrées macro) : le Pi dit « l'un des pilotes ... ».
      # Question 2 de la PR de la tâche 24.
      alarme_remplissage_y: "3"
      alarme_plateau_z: "3"
      alarme_plateau_a: "3"
      alarme_pousseur: "3"
  mycelium_lavage:
    description: Axes du mycélium et du lavage
    numero_serie_usb: "EXEMPLE-MYCELIUM-LAVAGE"
    # Entrées que le Pi lit dans le rapport d'état de la carte (« Pn: ») : le capteur de la
    # manivelle est le fin de course de l'axe A (jamais une butée) ; verrou et inclinaison du
    # porte-bocal sont sur les broches macro0 et macro1 (lettres 0 et 1), sans macro ; le
    # flotteur du fût de lavage sur macro2 (lettre 2).
    # À VÉRIFIER à l'essai de la carte (pi/systeme/essai-porte-bocal.md, essai-lavage.md).
    entrees:
      origine_manivelle: A
      verrou_plateau_engage: "0"
      inclinaison_bocal: "1"
      flotteur_lavage: "2"
      # ALM du pilote de la manivelle (macro3, sans macro) : EXEMPLE.
      alarme_manivelle: "3"
    # Sorties de la carte n° 3 (« user_outputs » digital0 à 7 de fluidnc/mycelium_lavage.yaml).
    # Implantation, sorties-carte-3.md, 07/11/2026 (les numéros P ne changent pas) : P0 et P1 le
    # pont en H du demi-tour (JGY370), JAMAIS ENSEMBLE (le Pi refuse), P2 le relais de la pompe de
    # vidange (fusible 8 A), P3 l'électrovanne d'eau, P4 la vanne à bille motorisée, P5 le jet d'air
    # du col. Tout est sur le 24 V coupé. P6 et P7 : EXEMPLES, la fiche n'en parle pas (verrou du
    # plateau et vanne 3 voies, qui étaient déjà sur cette carte). L'électrovanne de rinçage n'a
    # plus de place ici (FluidNC n'a que 8 sorties « digital ») : elle est sur la carte n° 4, P3.
    # Le chauffage du lavage n'est sur aucune carte FluidNC : c'est un relais du Pi (voir
    # docs/entrees-sorties.yaml, relais_chauffage_lavage).
    sorties:
      demi_tour_vers_tete_en_bas: 0
      demi_tour_vers_debout: 1
      pompe_lavage: 2
      eau_reseau_lavage: 3
      vanne_vidange_lavage: 4
      air_col_lavage: 5
      electroaimant_verrou_plateau: 6
      vanne_rampes_lavage: 7
  prehension:
    description: Axes de la préhension
    numero_serie_usb: "EXEMPLE-PREHENSION"
    # Contact de la tête (plateau flottant vu par un inductif M8) : c'est aussi le palpeur de
    # la carte (lettre P de « Pn: »), pour que la descente s'arrête tout de suite au contact.
    # À VÉRIFIER à l'essai de la carte (pi/systeme/essai-prehension.md).
    entrees:
      contact_tete: P
      # Capteur Hall de la rotation de la tête : fin de course de l'axe A.
      origine_rotation_tete: A
      # Alarme du pilote de Z (macro0, sans macro) : à vérifier à l'essai du portique.
      alarme_prehension_z: "0"
      # ALM des pilotes de la rotation de la tête et des brosses du lavage (macro1 à 3) : EXEMPLES.
      alarme_rotation_tete: "1"
      alarme_noyau_lavage: "2"
      alarme_couronne_lavage: "3"
    # Sorties « user_outputs » digital0 à 4 de fluidnc/prehension.yaml. P0 et P1 : les deux
    # électrovannes de la ventouse (Implantation, sorties-carte-4.md, 07/11/2026 : sorties
    # auxiliaires 24 V n° 1 et 2 de la carte, sur le 24 V coupé ; ces numéros ne changent pas) :
    # « aspirer » (vanne_vide, ev_aspirer de la fiche) et « souffler » (vanne_souffler,
    # ev_souffler). Jamais ouvertes en même temps (le Pi refuse). P2 : réservée au frein du Z de la
    # préhension (commandée = desserré). P4 : les 3 électroaimants des capsules, en parallèle
    # (module de sortie 24 V, jamais commandés séparément). Le jet d'air du col et le chauffage
    # du lavage ne sont PAS sur cette carte (fiche du 07/11). P3 (libre dans la fiche) : EXEMPLE,
    # l'électrovanne de rinçage du lavage, faute de place sur la carte n° 3.
    sorties:
      vanne_vide: 0
      vanne_souffler: 1
      frein_prehension_z: 2
      rincage_lavage: 3
      electroaimants_capsule: 4
