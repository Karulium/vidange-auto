# Réglages FluidNC de la carte n° 3 : axes du mycélium, eau du lavage (tâche 21).
#
# ATTENTION : EXEMPLE. Ne PAS envoyer ce fichier à la vraie carte avant d'avoir mis les vraies
# broches (plan de câblage) et les vrais pas par mm (poulies, réglage des pilotes). Les
# moteurs du lavage (noyau, couronne) sont sur la carte n° 4. Les chiffres marqués « (fiche) » sont ceux du module Mycélium validé le 24/10/2026.
#
# Repère : la position machine de chaque axe est celle de pi/reglages/machine.yaml
# (mm = mètres × 1000 ; degrés pour la manivelle).
#   X : avance du ruban du Micropore (tâche 40 ; plus la glissière de l'agitateur, retirée le
#       01/11/2026). Axe RELATIF (le Pi l'envoie en « G91 ») : pas d'origine, pas de limites.
#   A : manivelle. NEMA 34 à codeur, pilote HBS86H en 48 V. Elle tourne sans fin, dans les deux
#       sens : pas de limites logicielles. Jusqu'à 300 tr/min (fiche) = 108 000 °/min.
#       Le capteur origine_manivelle voit du MÉTAL quand la manivelle n'est PAS en haut, rien sur
#       ≈ ± 95° autour du haut (décision du 29/10/2026). FluidNC ne sait pas prendre le milieu
#       d'une zone : PAS de prise d'origine de A par FluidNC (pas de « homing »). Le capteur est
#       branché comme fin de course de A, seulement pour que le Pi le lise dans « Pn: » (lettre A,
#       pi/reglages/fluidnc.yaml) ; il n'est JAMAIS une butée (hard_limits: false). Le Pi fait un
#       tour lent et prend le milieu de la zone (vidange.mycelium.agitateur) : A reste l'angle du
#       moteur, le Pi retient l'angle « en haut ».
#   Y : mors du porte-bocal (tâche 20). NEMA 17 (17HS4401) sur un TMC2209 en UART ; vis
#       gauche-droite : la position de Y est l'ÉCART entre les 2 mors (mm). Prise d'origine sur
#       le fin de course « mors ouverts » : 103 mm (95 + 2 × 4 mm de jeu). Elle n'est faite que par
#       le Pi (« $HY », bocal debout), jamais par « $H » : à la mise sous tension, un bocal tête
#       en bas tomberait. Serrage : palpage « G38.3 » ; la sortie DIAG (StallGuard) du TMC2209 est
#       l'entrée « probe ». Le courant de serrage se règle ici (run_amps, hold_amps), à l'essai.
#   Sorties 24 V (fiche de l'Implantation sorties-carte-3.md, 07/11/2026), commandées par le Pi
#       (M64 / M65), toutes sur le 24 V coupé : pont en H du demi-tour (P0 et P1, jamais
#       ensemble), relais de la pompe de vidange, électrovanne d'eau, vanne à bille, jet d'air du
#       col, et (EXEMPLES) électroaimant du verrou du plateau et vanne 3 voies. Contact « verrou
#       engagé » et capteur d'inclinaison sur macro0 et macro1 (lettres 0 et 1 de « Pn: »), sans
#       macro ; flotteur du fût de lavage sur macro2 (lettre 2), recopié par le 2e contact de
#       relais_flotteur. Numéros et lettres : pi/reglages/fluidnc.yaml.
#   À VÉRIFIER à l'essai de la carte (pi/systeme/essai-porte-bocal.md, étape 1 ;
#   pi/systeme/essai-lavage.md) : « $HY » avec « cycle: 0 », les lettres de « Pn: », M64/M65.

name: "Vidange carte 3 - mycelium et lavage (EXEMPLE)"
board: "ESP32 6 axes, pilotes externes (EXEMPLE)"

stepping:
  engine: RMT
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 2
  disable_delay_us: 0

# Aucun axe de cette carte ne prend son origine par « $H » : les mors seulement par « $HY »
# (demandé par le Pi, bocal debout), la manivelle par le Pi (tour lent). Depuis que la glissière
# est retirée (agitateur fixe), plus de prise d'origine obligatoire à la mise sous tension.
start:
  must_home: false

axes:
  shared_stepper_disable_pin: NO_PIN

  y:
    # EXEMPLE : 200 pas × 16 micro-pas par tour, vis gauche-droite au pas de 2 mm (l'écart se
    # ferme de 4 mm par tour) → 800 pas par mm d'écart.
    steps_per_mm: 800
    max_rate_mm_per_min: 1500
    acceleration_mm_per_sec2: 100
    max_travel_mm: 23
    soft_limits: true
    homing:
      # 0 : jamais avec « $H » ; seulement « $HY », demandé par le Pi.
      cycle: 0
      positive_direction: true
      mpos_mm: 103
      feed_mm_per_min: 100
      seek_mm_per_min: 600
      settle_ms: 250
    motor0:
      # EXEMPLE de broche : fdc_mors_ouverts.
      limit_pos_pin: gpio.35:low
      hard_limits: false
      pulloff_mm: 1
      tmc_2209:
        uart_num: 1
        addr: 0
        r_sense_ohms: 0.11
        # Courant de serrage : EXEMPLE, à régler à l'essai (le bocal ne glisse pas, ne casse pas).
        run_amps: 0.6
        hold_amps: 0.5
        microsteps: 16
        # Sensibilité de StallGuard : EXEMPLE, à régler à l'essai.
        stallguard: 20
        stallguard_debug: false
        toff_disable: 0
        toff_stealthchop: 5
        toff_coolstep: 3
        run_mode: StallGuard
        homing_mode: CoolStep
        use_enable: false
        step_pin: gpio.13
        direction_pin: gpio.15
        disable_pin: NO_PIN

  x:
    # Avance du ruban du Micropore (tâche 40), en mm de ruban. EXEMPLE : 200 pas × 16 micro-pas
    # par tour, pignon MK8 de ≈ 7 mm de diamètre utile (courroie 1:1) ≈ 22 mm de ruban par tour
    # → 145,5 pas par mm (à mesurer sur le pignon reçu, pi/systeme/essai-micropore.md).
    steps_per_mm: 145.5
    max_rate_mm_per_min: 3000
    acceleration_mm_per_sec2: 500
    max_travel_mm: 1000
    soft_limits: false
    motor0:
      hard_limits: false
      pulloff_mm: 0
      standard_stepper:
        # EXEMPLES de broches.
        step_pin: gpio.12
        direction_pin: gpio.14
        disable_pin: NO_PIN

  a:
    # EXEMPLE : 4000 pas par tour sur le HBS86H → 11,111 pas par degré.
    steps_per_mm: 11.111
    max_rate_mm_per_min: 108000
    acceleration_mm_per_sec2: 3600
    max_travel_mm: 360
    soft_limits: false
    motor0:
      # EXEMPLE de broche : origine_manivelle, lu par le Pi (jamais une butée, pas de homing).
      limit_neg_pin: gpio.34:low
      hard_limits: false
      pulloff_mm: 0
      standard_stepper:
        step_pin: gpio.26
        direction_pin: gpio.27
        disable_pin: NO_PIN

# Liaison UART avec le TMC2209 des mors. EXEMPLES de broches.
uart1:
  txd_pin: gpio.4
  rxd_pin: gpio.16
  rts_pin: NO_PIN
  baud: 115200
  mode: 8N1

# Palpeur : sortie DIAG (StallGuard) du TMC2209 des mors. EXEMPLE de broche.
probe:
  pin: gpio.32:high
  check_mode_start: true

# Sorties du demi-tour du bocal et de l'eau du lavage (pi/reglages/fluidnc.yaml → sorties).
# EXEMPLES de broches.
#   digital0 : demi_tour_vers_tete_en_bas ; digital1 : demi_tour_vers_debout (jamais les deux) ;
#   digital2 : pompe_lavage ; digital3 : eau_reseau_lavage ; digital4 : vanne_vidange_lavage ;
#   digital5 : air_col_lavage ; digital6 : electroaimant_verrou_plateau (EXEMPLE) ;
#   digital7 : vanne_rampes_lavage (EXEMPLE).
user_outputs:
  digital0_pin: gpio.2
  digital1_pin: gpio.5
  digital2_pin: gpio.17
  digital3_pin: gpio.18
  digital4_pin: gpio.19
  digital5_pin: gpio.21
  digital6_pin: gpio.22
  digital7_pin: gpio.23

# Entrées lues par le Pi dans « Pn: » (pi/reglages/fluidnc.yaml → entrees). EXEMPLES de broches.
#   macro0 (lettre 0) : verrou_plateau_engage ; macro1 (lettre 1) : inclinaison_bocal ;
#   macro2 (lettre 2) : flotteur_lavage.
control:
  macro0_pin: gpio.33:low
  macro1_pin: gpio.25:low
  macro2_pin: gpio.0:low

# Aucune macro : ces broches servent seulement à être lues.
macros:
  macro0: ""
  macro1: ""
  macro2: ""
