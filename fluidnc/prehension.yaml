# Réglages FluidNC de la carte n° 4 : tête de préhension (Z et rotation), brosses du lavage.
#
# ATTENTION : EXEMPLE. Ne PAS envoyer ce fichier à la vraie carte avant d'avoir mis les vraies
# broches (plan de câblage), les vrais pas par mm et les vitesses. Chiffres de la fiche du module
# « Préhension » (validé définitivement le 27/10/2026) marqués « (fiche) ».
#
# Repère : la position machine de chaque axe est celle de pi/reglages/machine.yaml
# (mm = mètres × 1000 ; degrés pour la rotation).
#   Z : pignon-crémaillère (module 1, 16 dents : 50,27 mm par tour), NEMA 23 boucle fermée à
#       frein (maintien réduit à l'arrêt). Position machine = hauteur de la FACE de la tête. Prise
#       d'origine en haut, sur le fin de course fdc_prehension_haut (NF) : face à 1100 mm (fiche).
#       Course 870 mm (Préhension +22 cm, 04/11 : plaque Z de 1 308 à 2 178, face de 230 à 1 100).
#       Vitesses du Portique (28/10) :
#       80 mm/s, approche 20 mm/s, 0,5 m/s². Le Pi fait sa prise d'origine (« $HZ ») avec celle du
#       Z de la griffe, avant Y et X de la carte n° 1 (vidange.portique).
#       Frein à manque de courant : le Pi le desserre avant de bouger (sortie digital2,
#       frein_prehension_z ; P2 réservée au frein, Implantation 07/11/2026), le serre à l'arrêt
#       long. Alarme du pilote de Z sur macro0 (lettre 0 de « Pn: », sans macro) : arrêt et
#       alerte.
#   A : rotation de la tête, maintien plein (≈ 3 N·m pendant le brossage du lavage et le
#       vissage, fiche). Visser = sens horaire vu d'en haut = A positif ; aucun axe inversé
#       (fiche). Origine : origine_rotation_tete, capteur Hall sous la poulie de 60 dents (il voit
#       l'aimant à CHAQUE tour). « $HA » seulement (cycle 0), envoyé par le Pi
#       (vidange.portique.rotations) : il amène d'abord la tête 20° AVANT le Hall, d'après le
#       compte-tours (le tour) et l'angle enregistré (contrôle) ; puis la recherche est lente,
#       toujours en +, et limitée à 60° (bien moins d'un tour : jamais le Hall du tour suivant, le
#       cordon spiralé ne se vrille pas). Pas de butées sur la carte : le Pi garde ± 500°.
#   Contact de la tête (plateau flottant vu par un inductif M8 24 V) : c'est l'entrée « probe »
#       de la carte, pour que la descente au contact (« G38.3 ») s'arrête tout de suite. Le Pi le
#       lit dans « Pn: » (lettre P, pi/reglages/fluidnc.yaml).
#   B et C : noyau et couronne du lavage (tâche 21), NEMA 23 boucle fermée. La rotation de la
#       tête (A) est dans la même commande : elle suit le seau. Pas de capteur d'origine (Hall
#       supprimé le 22/10), pas de prise d'origine : leur position ne compte pas. Ils ne
#       tournent que dans un sens (« en avant »), sans fin : pas de limites logicielles.
#       Jusqu'à 200 tr/min pour le noyau (fiche) = 72 000 °/min.
#   Vanne du venturi et électroaimants des capsules : 2 sorties « user_outputs », commandées par
#       le Pi (M64 / M65). Jet d'air du col et chauffage du lavage : 2 de plus (la carte n° 3 n'a
#       plus de sortie libre). Numéros : pi/reglages/fluidnc.yaml.
#   À VÉRIFIER à l'essai de la carte (pi/systeme/essai-prehension.md, étape 1) : sens de A, la
#   lettre P de « Pn: » au contact, M64/M65, « G38.3 » qui s'arrête au contact ; sens de B et C
#   (pi/systeme/essai-lavage.md).

name: "Vidange carte 4 - prehension (EXEMPLE)"
board: "ESP32 6 axes, pilotes externes (EXEMPLE)"

stepping:
  engine: RMT
  idle_ms: 255
  pulse_us: 4
  dir_delay_us: 2
  disable_delay_us: 0

# Prise d'origine obligatoire à la mise sous tension (docs/decisions.md).
start:
  must_home: true

axes:
  shared_stepper_disable_pin: NO_PIN

  z:
    # EXEMPLE : 1600 pas par tour sur le pilote, pignon de 50,27 mm de tour (module 1, 16 dents).
    steps_per_mm: 31.83
    max_rate_mm_per_min: 4800
    acceleration_mm_per_sec2: 500
    # Face de 230 à 1 100 mm.
    max_travel_mm: 870
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: true
      mpos_mm: 1100
      feed_mm_per_min: 120
      seek_mm_per_min: 1200
      settle_ms: 250
    motor0:
      # EXEMPLE de broche : fdc_prehension_haut.
      limit_pos_pin: gpio.36:low
      hard_limits: true
      pulloff_mm: 2
      standard_stepper:
        step_pin: gpio.12
        direction_pin: gpio.14
        disable_pin: NO_PIN

  a:
    # EXEMPLE : 1600 pas par tour sur le pilote, réduction 1:5 → 22,222 pas par degré.
    steps_per_mm: 22.222
    max_rate_mm_per_min: 5400
    acceleration_mm_per_sec2: 360
    # Recherche du Hall : 60° au plus (seek_scaler 1). Le Pi garde ± 500° (machine.yaml →
    # prehension_a, réponse de la Préhension du 29/10).
    max_travel_mm: 60
    soft_limits: false
    homing:
      # « $HA » seulement, envoyé par le Pi (à VÉRIFIER à l'essai : FluidNC accepte « $HA » d'un
      # axe du cycle 0).
      cycle: 0
      # Toujours en +.
      positive_direction: true
      # Hall = A 0 : la position après le recul vaut −pulloff_mm (à VÉRIFIER à l'essai).
      mpos_mm: -2
      seek_mm_per_min: 600
      # Approche finale lente (répétabilité meilleure que 1°).
      feed_mm_per_min: 120
      seek_scaler: 1.0
      settle_ms: 250
    motor0:
      # EXEMPLE de broche : origine_rotation_tete (Hall).
      limit_pos_pin: gpio.39:low
      hard_limits: false
      pulloff_mm: 2
      standard_stepper:
        step_pin: gpio.26
        direction_pin: gpio.27
        disable_pin: NO_PIN

  b:
    # Noyau du lavage. EXEMPLE : 1600 pas par tour sur le pilote, entraînement direct →
    # 4,444 pas par degré. Aucune prise d'origine, aucune limite.
    steps_per_mm: 4.444
    max_rate_mm_per_min: 72000
    acceleration_mm_per_sec2: 1200
    max_travel_mm: 360
    soft_limits: false
    motor0:
      hard_limits: false
      pulloff_mm: 0
      standard_stepper:
        step_pin: gpio.13
        direction_pin: gpio.15
        disable_pin: NO_PIN

  c:
    # Couronne du lavage. EXEMPLE : comme le noyau, 100 tr/min au plus.
    steps_per_mm: 4.444
    max_rate_mm_per_min: 36000
    acceleration_mm_per_sec2: 1200
    max_travel_mm: 360
    soft_limits: false
    motor0:
      hard_limits: false
      pulloff_mm: 0
      standard_stepper:
        step_pin: gpio.25
        direction_pin: gpio.33
        disable_pin: NO_PIN

# Palpeur : contact de la tête (inductif M8, plateau flottant). EXEMPLE de broche.
probe:
  pin: gpio.32:low
  check_mode_start: true

# Alarme du pilote de Z (alarme_prehension_z), lue par le Pi (lettre 0). EXEMPLE de broche.
control:
  macro0_pin: gpio.34:low

# Sorties (pi/reglages/fluidnc.yaml → sorties). EXEMPLES de broches : les vrais numéros viendront
# du fichier de configuration de la carte achetée (sorties-carte-4.md, Implantation, 07/11/2026).
#   digital0 : vanne_vide (« aspirer », sortie auxiliaire 24 V n° 1) ;
#   digital1 : vanne_souffler (« souffler », sortie auxiliaire 24 V n° 2) ;
#   digital2 : frein_prehension_z (commandée = desserré ; sortie n° 3 ou module de sortie) ;
#   digital3 : libre ; digital4 : electroaimants_capsule ; digital5 : air_col_lavage ;
#   digital6 : chauffage_lavage.
# Les deux électrovannes sont sur le 24 V coupé : fermées à l'arrêt d'urgence. Diode de roue
# libre sur chaque bobine si la sortie n'en a pas.
user_outputs:
  digital0_pin: gpio.2
  digital1_pin: gpio.5
  digital2_pin: gpio.19
  digital4_pin: gpio.17
  digital5_pin: gpio.18
  digital6_pin: gpio.23
